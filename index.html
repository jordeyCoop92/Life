<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Theme tokens ===== */
:root {
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --accent-teal:   #31A581;
  --accent-purple: #725CAD;
  --accent-gold:   #DDA500;
  --accent-blue:   #4488AD;
  --accent-red:    #A02149;
  --accent-pink:   #C0548D;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
}

body[data-theme="dark"] {
  --bg:          #161F34;
  --bg-sidebar:  #12192B;
  --surface:     #202A44;
  --surface-2:   #2D3852;
  --surface-3:   #35456D;
  --border:      #303F60;
  --text:        #F2F4F9;
  --text-muted:  #8D97B8;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}

body[data-theme="light"] {
  --bg:          #F4F5FA;
  --bg-sidebar:  #FFFFFF;
  --surface:     #FFFFFF;
  --surface-2:   #EEF0F7;
  --surface-3:   #E2E5F0;
  --border:      #DFE2EE;
  --text:        #161F34;
  --text-muted:  #6B7290;
  --shadow: 0 8px 24px rgba(22,31,52,0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }

/* ===== Shell layout ===== */
.app-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 232px;
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 22px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
}
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  text-align: left;
  background: none; border: none;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--surface-2); color: var(--text); }
.nav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
}
.nav-item.active .nav-dot { background: var(--accent-blue); }

.sidebar-footer { padding-top: 12px; border-top: 1px solid var(--border); }
.theme-toggle {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
}
.theme-toggle:hover { background: var(--surface-3); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 32px 16px;
  flex-shrink: 0;
}
.topbar h1 { font-size: 22px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; }

.view-container { flex: 1; overflow-y: auto; padding: 0 32px 32px; }
.view { display: none; }
.view.active { display: block; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
  color: #fff;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger { color: var(--accent-red); }

/* ===== Cards / grid ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
}
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-top: 6px; }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.section-title {
  font-size: 15px; font-weight: 600;
  margin: 28px 0 12px;
  display: flex; align-items: center; justify-content: space-between;
}

/* ===== Badges ===== */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; }

.status-to_do        { background: rgba(141,151,184,0.15); color: var(--text-muted); }
.status-to_do .badge-dot { background: var(--text-muted); }
.status-in_progress   { background: rgba(68,136,173,0.15); color: var(--accent-blue); }
.status-in_progress .badge-dot { background: var(--accent-blue); }
.status-hold          { background: rgba(221,165,0,0.15); color: var(--accent-gold); }
.status-hold .badge-dot { background: var(--accent-gold); }
.status-review        { background: rgba(114,92,173,0.15); color: var(--accent-purple); }
.status-review .badge-dot { background: var(--accent-purple); }
.status-completed     { background: rgba(49,165,129,0.15); color: var(--accent-teal); }
.status-completed .badge-dot { background: var(--accent-teal); }
.status-overdue       { background: rgba(160,33,73,0.15); color: var(--accent-red); }
.status-overdue .badge-dot { background: var(--accent-red); }
.status-canceled      { background: rgba(141,151,184,0.15); color: var(--text-muted); text-decoration: line-through; }
.status-canceled .badge-dot { background: var(--text-muted); }

.priority-very_high, .priority-high { color: var(--accent-red); }
.priority-medium { color: var(--accent-gold); }
.priority-low, .priority-very_low { color: var(--text-muted); }

/* ===== Lists / rows ===== */
.list { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
}
.row:hover { border-color: var(--surface-3); }
.row-check {
  width: 18px; height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
}
.row-check.checked { background: var(--accent-teal); border-color: var(--accent-teal); color: #fff; }
.row-title { flex: 1; font-size: 14px; font-weight: 500; }
.row-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.row-title.done { text-decoration: line-through; color: var(--text-muted); }

.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
  font-size: 13px;
}

/* ===== Kanban ===== */
.kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.kanban-col { background: var(--surface-2); border-radius: var(--radius-md); padding: 12px; min-height: 120px; }
.kanban-col-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
.kanban-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; font-weight: 500; cursor: grab; }
.kanban-card:hover { border-color: var(--surface-3); }

/* ===== Calendar ===== */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.calendar-dow { background: var(--surface-2); text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 8px 0; text-transform: uppercase; letter-spacing: 0.04em; }
.calendar-cell { background: var(--surface); min-height: 96px; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.calendar-cell.other-month { opacity: 0.35; }
.calendar-cell.today { box-shadow: inset 0 0 0 2px var(--accent-blue); }
.calendar-date { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.calendar-event { font-size: 10.5px; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calendar-nav { display: flex; align-items: center; gap: 10px; }
.calendar-nav h2 { font-size: 16px; font-weight: 600; min-width: 160px; text-align: center; }

/* ===== Forms / modal ===== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,14,24,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  width: 420px;
  max-width: 92vw;
  max-height: 86vh;
  overflow-y: auto;
  padding: 22px;
}
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  font-size: 13px;
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-blue); }
.field textarea { resize: vertical; min-height: 60px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

.tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.tab-btn { background: none; border: none; padding: 8px 4px; margin-right: 14px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent-blue); }

.placeholder-card { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.placeholder-card h3 { color: var(--text); margin-bottom: 8px; }

</style>
</head>

<script>

// ===== config.js =====
// Supabase project connection details for your "life-hq" project.
// The anon/publishable key is safe to expose in client-side code —
// it's the same mechanism every Supabase app uses. Just don't publish
// this repo publicly without adding Row Level Security later if that
// ever matters to you.
const SUPABASE_URL = "https://gkpzipgvuuiflmjsozes.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrcHppcGd2dXVpZmxtanNvemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzE2MjEsImV4cCI6MjEwMTc0NzYyMX0.5W63f9Ffh8sDO-igJdmk9-N_xdrKMSzIvKMc2Fk6Eu0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


// ===== db.js =====
// Small wrapper around Supabase table calls so the rest of the app
// doesn't have to repeat error handling everywhere.
const DB = {
  async list(table, { order, ascending = true, filters = {} } = {}) {
    let q = sb.from(table).select("*");
    for (const [col, val] of Object.entries(filters)) {
      if (val === null) q = q.is(col, null);
      else q = q.eq(col, val);
    }
    if (order) q = q.order(order, { ascending });
    const { data, error } = await q;
    if (error) { console.error(table, error); return []; }
    return data || [];
  },

  async insert(table, row) {
    const { data, error } = await sb.from(table).insert(row).select().single();
    if (error) { console.error(table, error); alert("Couldn't save: " + error.message); return null; }
    return data;
  },

  async update(table, id, patch) {
    const { data, error } = await sb.from(table).update(patch).eq("id", id).select().single();
    if (error) { console.error(table, error); alert("Couldn't update: " + error.message); return null; }
    return data;
  },

  async remove(table, id) {
    const { error } = await sb.from(table).delete().eq("id", id);
    if (error) { console.error(table, error); alert("Couldn't delete: " + error.message); return false; }
    return true;
  },

  async getSettings() {
    const { data, error } = await sb.from("settings").select("*").eq("id", 1).single();
    if (error) { console.error(error); return { currency_symbol: "$", week_start_day: "sunday", theme_mode: "dark" }; }
    return data;
  },

  async updateSettings(patch) {
    return this.update("settings", 1, patch);
  }
};


// ===== theme.js =====
const Theme = {
  async init() {
    const saved = localStorage.getItem("lifehq-theme");
    const mode = saved || "dark";
    this.apply(mode);

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const current = document.body.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      this.apply(next);
      localStorage.setItem("lifehq-theme", next);
      DB.updateSettings({ theme_mode: next });
    });
  },

  apply(mode) {
    document.body.setAttribute("data-theme", mode);
    document.getElementById("theme-toggle-label").textContent =
      mode === "dark" ? "Dark mode" : "Light mode";
  }
};


// ===== ui.js =====
const STATUS_LABELS = {
  to_do: "To do",
  in_progress: "In progress",
  hold: "Hold",
  review: "To review",
  completed: "Completed",
  overdue: "Overdue",
  canceled: "Canceled"
};

const PRIORITY_LABELS = {
  very_high: "Very high",
  high: "High",
  medium: "Medium",
  low: "Low",
  very_low: "Very low"
};

function statusBadge(status) {
  const s = status || "to_do";
  const label = STATUS_LABELS[s] || s;
  return `<span class="badge status-${s}"><span class="badge-dot"></span>${label}</span>`;
}

function priorityLabel(p) {
  if (!p) return "";
  return `<span class="priority-${p}">${PRIORITY_LABELS[p] || p}</span>`;
}

function fmtDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function fmtDateLong(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function isOverdue(dateStr, status) {
  if (!dateStr || status === "completed" || status === "canceled") return false;
  return dateStr < todayISO();
}

let CURRENCY = "$";
function fmtMoney(n) {
  const v = Number(n || 0);
  return CURRENCY + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ---- Modal ----
function openModal(html) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal">${html}</div></div>`;
  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop") closeModal();
  });
}
function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// ---- Recurrence ----
const RECUR_LABELS = { none: "Doesn't repeat", daily: "Daily", every_other_day: "Every other day", weekly: "Weekly", biweekly: "Bi-weekly", monthly: "Monthly", quarterly: "Quarterly", yearly: "Yearly" };
function advanceDate(dateStr, rule) {
  const d = new Date(dateStr + "T00:00:00");
  if (rule === "daily") d.setDate(d.getDate() + 1);
  else if (rule === "every_other_day") d.setDate(d.getDate() + 2);
  else if (rule === "weekly") d.setDate(d.getDate() + 7);
  else if (rule === "biweekly") d.setDate(d.getDate() + 14);
  else if (rule === "monthly") d.setMonth(d.getMonth() + 1);
  else if (rule === "quarterly") d.setMonth(d.getMonth() + 3);
  else if (rule === "yearly") d.setFullYear(d.getFullYear() + 1);
  else return dateStr;
  return d.toISOString().slice(0, 10);
}
function recurSelectHtml(fieldId, selected) {
  return `<select id="${fieldId}">${Object.entries(RECUR_LABELS).map(([k, v]) => `<option value="${k}" ${selected === k ? "selected" : ""}>${v}</option>`).join("")}</select>`;
}

// Shared "complete a task" action so recurring logic lives in one place.
async function completeTask(task) {
  const nowChecked = task.status === "completed";
  if (!nowChecked && task.is_recurring && task.recurrence_rule && task.recurrence_rule !== "none") {
    // cycle forward instead of closing out
    const nextDue = advanceDate(task.due_date || todayISO(), task.recurrence_rule);
    await DB.update("tasks", task.id, { due_date: nextDue, status: "to_do", completed_at: null });
  } else {
    await DB.update("tasks", task.id, { status: nowChecked ? "to_do" : "completed", completed_at: nowChecked ? null : new Date().toISOString() });
  }
}

// ---- Tiny SVG charts (no external library) ----
function svgDonut(segments, size = 120) {
  // segments: [{label, value, color}]
  const total = segments.reduce((s, x) => s + x.value, 0);
  if (!total) return `<div class="empty-state">No data</div>`;
  const r = size / 2 - 10, cx = size / 2, cy = size / 2, circumference = 2 * Math.PI * r;
  let offset = 0;
  const circles = segments.filter(s => s.value > 0).map(s => {
    const frac = s.value / total;
    const dash = frac * circumference;
    const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += dash;
    return circle;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}
function chartLegend(segments) {
  return `<div style="display:flex;flex-direction:column;gap:6px">${segments.filter(s => s.value > 0).map(s => `
    <div style="display:flex;align-items:center;gap:8px;font-size:12px">
      <span style="width:9px;height:9px;border-radius:2px;background:${s.color};flex-shrink:0"></span>
      <span style="flex:1">${s.label}</span><span style="color:var(--text-muted);font-weight:600">${s.value}</span>
    </div>`).join("")}</div>`;
}
function svgBar(segments, width = 260, height = 100) {
  const max = Math.max(1, ...segments.map(s => s.value));
  const barW = width / segments.length - 8;
  return `<svg width="${width}" height="${height + 20}">
    ${segments.map((s, i) => {
      const h = (s.value / max) * height;
      const x = i * (barW + 8);
      return `<rect x="${x}" y="${height - h}" width="${barW}" height="${h}" rx="3" fill="${s.color}"></rect>
        <text x="${x + barW / 2}" y="${height + 14}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${s.label}</text>`;
    }).join("")}
  </svg>`;
}


// ===== pick-lists.js =====
// Renders a <select> populated from a pick_lists list_type, with a
// trailing "+ Add new…" option that inserts a fresh entry on the fly.
function categorySelectHtml(fieldId, list, selectedValue, placeholder = "— None —") {
  return `<select id="${fieldId}">
    <option value="">${placeholder}</option>
    ${list.map(o => `<option value="${o.label}" ${selectedValue === o.label ? "selected" : ""}>${o.label}</option>`).join("")}
    <option value="__add_new__">+ Add new…</option>
  </select>`;
}

function bindCategorySelect(fieldId, listType) {
  const el = document.getElementById(fieldId);
  if (!el) return;
  el.addEventListener("change", async (e) => {
    if (e.target.value !== "__add_new__") return;
    const label = prompt("New " + listType.replace(/_/g, " ") + ":");
    if (label && label.trim()) {
      const row = await DB.insert("pick_lists", { list_type: listType, label: label.trim() });
      if (row) {
        const opt = document.createElement("option");
        opt.value = row.label; opt.textContent = row.label;
        el.insertBefore(opt, el.lastElementChild);
        el.value = row.label;
        return;
      }
    }
    el.selectedIndex = 0;
  });
}

async function getPickList(listType) {
  const rows = await DB.list("pick_lists", { filters: { list_type: listType }, order: "sort_order" });
  return rows;
}


// ===== render-tasks.js =====
const KANBAN_COLUMNS = ["to_do", "in_progress", "hold", "review", "completed"];

const Tasks = {
  mode: "list", // list | kanban | matrix | gantt
  scopeProjectId: null,
  filterStatus: "",
  filterCategory: "",
  sortBy: "due_date",

  async render(projectId = null) {
    this.scopeProjectId = projectId;
    const container = document.getElementById("view-tasks");
    const [tasks, projects, phases] = await Promise.all([
      DB.list("tasks", { order: "due_date" }),
      DB.list("projects", { order: "name" }),
      projectId ? DB.list("project_phases", { filters: { project_id: projectId }, order: "sort_order" }) : Promise.resolve([])
    ]);
    this._tasks = tasks;
    this._projects = projects;
    this._phases = phases;
    this._draw(container);
  },

  _scopedList() {
    let list = this.scopeProjectId
      ? this._tasks.filter(t => t.project_id === this.scopeProjectId)
      : this._tasks.filter(t => !t.project_id);
    if (this.filterStatus) list = list.filter(t => (t.status || "to_do") === this.filterStatus);
    if (this.filterCategory) list = list.filter(t => t.category === this.filterCategory);
    const sorters = {
      due_date: (a, b) => (a.due_date || "9999").localeCompare(b.due_date || "9999"),
      priority: (a, b) => (a.priority || "").localeCompare(b.priority || ""),
      created: (a, b) => (b.created_at || "").localeCompare(a.created_at || "")
    };
    return [...list].sort(sorters[this.sortBy] || sorters.due_date);
  },

  _draw(container) {
    const scoped = this._scopedList();
    container.innerHTML = `
      <div class="tabs">
        <button class="tab-btn ${this.mode === 'list' ? 'active' : ''}" data-mode="list">List</button>
        <button class="tab-btn ${this.mode === 'kanban' ? 'active' : ''}" data-mode="kanban">Kanban</button>
        <button class="tab-btn ${this.mode === 'matrix' ? 'active' : ''}" data-mode="matrix">Decision matrix</button>
        <button class="tab-btn ${this.mode === 'gantt' ? 'active' : ''}" data-mode="gantt">Gantt</button>
      </div>
      <div id="tasks-body"></div>
    `;

    container.querySelectorAll(".tab-btn").forEach(b =>
      b.addEventListener("click", () => { this.mode = b.dataset.mode; this._draw(container); })
    );

    const body = document.getElementById("tasks-body");
    if (this.mode === "list") this._drawList(body, scoped);
    else if (this.mode === "kanban") this._drawKanban(body, scoped);
    else if (this.mode === "gantt") this._drawGantt(body, scoped);
    else this._drawMatrix(body, scoped);
  },

  async _drawList(body, list) {
    const cats = await getPickList("task_category");
    const statusCounts = KANBAN_COLUMNS.map((s, i) => ({
      label: STATUS_LABELS[s], value: list.filter(t => (t.status || "to_do") === s).length,
      color: ["var(--text-muted)", "var(--accent-blue)", "var(--accent-gold)", "var(--accent-purple)", "var(--accent-teal)"][i]
    }));

    body.innerHTML = `
      <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
        <select id="f-filter-status" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:12px">
          <option value="">All statuses</option>
          ${KANBAN_COLUMNS.map(s => `<option value="${s}" ${this.filterStatus === s ? "selected" : ""}>${STATUS_LABELS[s]}</option>`).join("")}
        </select>
        <select id="f-filter-category" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:12px">
          <option value="">All categories</option>
          ${cats.map(c => `<option value="${c.label}" ${this.filterCategory === c.label ? "selected" : ""}>${c.label}</option>`).join("")}
        </select>
        <select id="f-sort" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:12px">
          <option value="due_date" ${this.sortBy === "due_date" ? "selected" : ""}>Sort: Due date</option>
          <option value="priority" ${this.sortBy === "priority" ? "selected" : ""}>Sort: Priority</option>
          <option value="created" ${this.sortBy === "created" ? "selected" : ""}>Sort: Newest</option>
        </select>
        ${(this.filterStatus || this.filterCategory) ? `<button class="btn btn-sm btn-ghost" id="f-clear">Clear filters</button>` : ""}
      </div>
      <div class="grid grid-2">
        <div class="list">${
          list.length ? list.map(t => this._rowHtml(t)).join("") : `<div class="empty-state">No tasks match. Add one or clear filters.</div>`
        }</div>
        <div class="card" style="max-width:220px;justify-self:end">
          <div class="stat-label" style="margin-bottom:10px">By status</div>
          <div style="display:flex;gap:14px;align-items:center">${svgDonut(statusCounts, 90)}${chartLegend(statusCounts)}</div>
        </div>
      </div>
    `;
    document.getElementById("f-filter-status").onchange = (e) => { this.filterStatus = e.target.value; this._draw(body.closest(".view")); };
    document.getElementById("f-filter-category").onchange = (e) => { this.filterCategory = e.target.value; this._draw(body.closest(".view")); };
    document.getElementById("f-sort").onchange = (e) => { this.sortBy = e.target.value; this._draw(body.closest(".view")); };
    const clearBtn = document.getElementById("f-clear");
    if (clearBtn) clearBtn.onclick = () => { this.filterStatus = ""; this.filterCategory = ""; this._draw(body.closest(".view")); };
    this._bindRows(body);
  },

  _rowHtml(t) {
    const proj = this._projects.find(p => p.id === t.project_id);
    const status = isOverdue(t.due_date, t.status) ? "overdue" : (t.status || "to_do");
    return `
      <div class="row" data-open="${t.id}">
        <div class="row-check ${t.status === 'completed' ? 'checked' : ''}" data-check="${t.id}">✓</div>
        <div class="row-title ${t.status === 'completed' ? 'done' : ''}">${t.is_recurring ? "↻ " : ""}${t.title}${proj ? ` <span style="color:var(--text-muted);font-weight:400">· ${proj.name}</span>` : ""}</div>
        <div class="row-meta">
          ${priorityLabel(t.priority)}
          ${t.due_date ? fmtDate(t.due_date) : ""}
          ${statusBadge(status)}
        </div>
      </div>`;
  },

  _bindRows(body) {
    body.querySelectorAll("[data-check]").forEach(chk => {
      chk.addEventListener("click", async (e) => {
        e.stopPropagation();
        const task = this._tasks.find(t => t.id === chk.dataset.check);
        await completeTask(task);
        this.render(this.scopeProjectId);
      });
    });
    body.querySelectorAll("[data-open]").forEach(row => {
      row.addEventListener("click", () => this._openForm(this._tasks.find(t => t.id === row.dataset.open)));
    });
  },

  _drawKanban(body, list) {
    body.innerHTML = `<div class="kanban">${KANBAN_COLUMNS.map(col => `
      <div class="kanban-col" data-col="${col}">
        <div class="kanban-col-title"><span>${STATUS_LABELS[col]}</span><span>${list.filter(t => (t.status || 'to_do') === col).length}</span></div>
        ${list.filter(t => (t.status || 'to_do') === col).map(t => `
          <div class="kanban-card" draggable="true" data-open="${t.id}" data-drag="${t.id}">${t.is_recurring ? "↻ " : ""}${t.title}</div>
        `).join("")}
      </div>
    `).join("")}</div>`;
    body.querySelectorAll("[data-open]").forEach(card => {
      card.addEventListener("click", () => this._openForm(this._tasks.find(t => t.id === card.dataset.open)));
    });
    // drag and drop
    let draggedId = null;
    body.querySelectorAll("[data-drag]").forEach(card => {
      card.addEventListener("dragstart", (e) => { draggedId = card.dataset.drag; e.dataTransfer.effectAllowed = "move"; });
    });
    body.querySelectorAll(".kanban-col").forEach(col => {
      col.addEventListener("dragover", (e) => e.preventDefault());
      col.addEventListener("drop", async (e) => {
        e.preventDefault();
        if (!draggedId) return;
        const newStatus = col.dataset.col;
        const task = this._tasks.find(t => t.id === draggedId);
        if (task && task.status !== newStatus) {
          await DB.update("tasks", draggedId, { status: newStatus, completed_at: newStatus === "completed" ? new Date().toISOString() : null });
          this.render(this.scopeProjectId);
        }
      });
    });
  },

  _drawGantt(body, list) {
    const items = list.filter(t => t.due_date || t.start_date);
    if (!items.length) { body.innerHTML = `<div class="empty-state">Add start/due dates to tasks to see them on the Gantt chart.</div>`; return; }
    const starts = items.map(t => new Date(t.start_date || t.due_date));
    const ends = items.map(t => new Date(t.due_date || t.start_date));
    const rangeStart = new Date(Math.min(...starts));
    const rangeEnd = new Date(Math.max(...ends));
    rangeStart.setDate(rangeStart.getDate() - 1);
    rangeEnd.setDate(rangeEnd.getDate() + 1);
    const totalDays = Math.max(1, Math.round((rangeEnd - rangeStart) / 86400000));
    const colors = ["var(--accent-blue)", "var(--accent-purple)", "var(--accent-teal)", "var(--accent-gold)", "var(--accent-pink)"];

    body.innerHTML = `
      <div class="card" style="overflow-x:auto">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px">${fmtDate(rangeStart.toISOString().slice(0,10))} → ${fmtDate(rangeEnd.toISOString().slice(0,10))}</div>
        <div style="min-width:600px">
          ${items.map((t, i) => {
            const s = new Date(t.start_date || t.due_date);
            const e = new Date(t.due_date || t.start_date);
            const offset = Math.max(0, Math.round((s - rangeStart) / 86400000));
            const dur = Math.max(1, Math.round((e - s) / 86400000) + 1);
            const leftPct = (offset / totalDays) * 100;
            const widthPct = (dur / totalDays) * 100;
            return `
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <div style="width:140px;font-size:12px;font-weight:500;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.title}</div>
                <div style="flex:1;position:relative;height:20px;background:var(--surface-2);border-radius:5px">
                  <div style="position:absolute;left:${leftPct}%;width:${widthPct}%;height:100%;border-radius:5px;background:${colors[i % colors.length]}"></div>
                </div>
              </div>`;
          }).join("")}
        </div>
      </div>
    `;
  },

  _drawMatrix(body, list) {
    const quads = [
      { key: [true, true], title: "Urgent & important — do now", accent: "var(--accent-red)" },
      { key: [false, true], title: "Important, not urgent — decide when", accent: "var(--accent-blue)" },
      { key: [true, false], title: "Urgent, not important — delegate", accent: "var(--accent-gold)" },
      { key: [false, false], title: "Neither — delete / drop", accent: "var(--text-muted)" }
    ];
    body.innerHTML = `<div class="grid grid-2">${quads.map(q => {
      const items = list.filter(t => !!t.decision_urgent === q.key[0] && !!t.decision_important === q.key[1]);
      return `<div class="card">
        <div style="font-size:12px;font-weight:600;color:${q.accent};margin-bottom:10px">${q.title}</div>
        <div class="list">${items.length ? items.map(t => `<div class="row" data-open="${t.id}"><div class="row-title">${t.title}</div></div>`).join("") : `<div class="empty-state" style="padding:16px">Empty</div>`}</div>
      </div>`;
    }).join("")}</div>`;
    body.querySelectorAll("[data-open]").forEach(row => {
      row.addEventListener("click", () => this._openForm(list.find(t => t.id === row.dataset.open)));
    });
  },

  async _openForm(task) {
    const isEdit = !!task;
    task = task || {};
    const projectOptions = this._projects.map(p =>
      `<option value="${p.id}" ${task.project_id === p.id ? "selected" : ""}>${p.name}</option>`
    ).join("");
    const [taskCats, people] = await Promise.all([getPickList("task_category"), getPickList("person")]);
    const phaseOptions = this._phases.length
      ? `<div class="field"><label>Phase</label><select id="f-phase"><option value="">— None —</option>${this._phases.map(ph => `<option value="${ph.id}" ${task.phase_id === ph.id ? "selected" : ""}>${ph.name}</option>`).join("")}</select></div>`
      : "";

    openModal(`
      <h3>${isEdit ? "Edit task" : "New task"}</h3>
      <div class="field"><label>Title</label><input id="f-title" value="${task.title || ""}" placeholder="Task name"></div>
      <div class="field"><label>Description</label><textarea id="f-desc">${task.description || ""}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Status</label>
          <select id="f-status">${KANBAN_COLUMNS.map(s => `<option value="${s}" ${task.status === s ? "selected" : ""}>${STATUS_LABELS[s]}</option>`).join("")}<option value="canceled" ${task.status === 'canceled' ? "selected" : ""}>Canceled</option></select>
        </div>
        <div class="field"><label>Priority</label>
          <select id="f-priority">${Object.entries(PRIORITY_LABELS).map(([k,v]) => `<option value="${k}" ${task.priority === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Start date</label><input id="f-start" type="date" value="${task.start_date || ""}"></div>
        <div class="field"><label>Due date</label><input id="f-due" type="date" value="${task.due_date || ""}"></div>
      </div>
      <div class="field"><label>Repeats</label>${recurSelectHtml("f-recur", task.recurrence_rule || "none")}</div>
      <div class="field"><label>Project (optional)</label><select id="f-project"><option value="">— None —</option>${projectOptions}</select></div>
      ${phaseOptions}
      <div class="field-row">
        <div class="field"><label>Category</label>${categorySelectHtml("f-category", taskCats, task.category || "")}</div>
        <div class="field"><label>Person in charge</label>${categorySelectHtml("f-person", people, task.person_in_charge || "")}</div>
      </div>
      <div class="field-row">
        <div class="field"><label><input type="checkbox" id="f-urgent" ${task.decision_urgent ? "checked" : ""}> Urgent</label></div>
        <div class="field"><label><input type="checkbox" id="f-important" ${task.decision_important ? "checked" : ""}> Important</label></div>
      </div>
      <div class="modal-actions">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete">Delete</button>` : ""}
        <button class="btn" id="f-cancel">Cancel</button>
        <button class="btn btn-primary" id="f-save">Save</button>
      </div>
    `);
    document.getElementById("f-project").value = task.project_id || "";
    bindCategorySelect("f-category", "task_category");
    bindCategorySelect("f-person", "person");

    document.getElementById("f-cancel").onclick = closeModal;
    if (isEdit) document.getElementById("f-delete").onclick = async () => {
      await DB.remove("tasks", task.id);
      closeModal();
      this.render(this.scopeProjectId);
    };
    document.getElementById("f-save").onclick = async () => {
      const recur = document.getElementById("f-recur").value;
      const phaseEl = document.getElementById("f-phase");
      const patch = {
        title: document.getElementById("f-title").value.trim(),
        description: document.getElementById("f-desc").value,
        status: document.getElementById("f-status").value,
        priority: document.getElementById("f-priority").value,
        start_date: document.getElementById("f-start").value || null,
        due_date: document.getElementById("f-due").value || null,
        is_recurring: recur !== "none",
        recurrence_rule: recur === "none" ? null : recur,
        project_id: document.getElementById("f-project").value || null,
        phase_id: phaseEl ? (phaseEl.value || null) : null,
        category: document.getElementById("f-category").value,
        person_in_charge: document.getElementById("f-person").value,
        decision_urgent: document.getElementById("f-urgent").checked,
        decision_important: document.getElementById("f-important").checked
      };
      if (!patch.title) return alert("Give the task a title.");
      if (isEdit) await DB.update("tasks", task.id, patch);
      else await DB.insert("tasks", patch);
      closeModal();
      this.render(this.scopeProjectId);
    };
  }
};

              ${KANBAN_COLUMNS.map(s => `<option value="${s}" ${ph.status === s ? "selected" : ""}>${STATUS_LABELS[s]}</option>`).join("")}
            </select>
            <div class="row-title">${ph.name}</div>
            <button class="btn btn-sm btn-ghost" data-phase-del="${ph.id}">✕</button>
          </div>
        `).join("") : `<div class="empty-state">No phases yet.</div>`}
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="f-delete">Delete project</button>
        <button class="btn" id="f-edit-full">Edit details</button>
        <button class="btn btn-primary" id="f-board">Open task board →</button>

    document.getElementById("f-edit-full").onclick = () => { closeModal(); this._openForm(project); };
    document.getElementById("add-phase").onclick = async () => {
      const name = prompt("Phase name (e.g. \"Phase 1 — Planning\"):");
      if (name && name.trim()) {
        await DB.insert("project_phases", { project_id: project.id, name: name.trim(), status: "to_do", sort_order: phases.length });
        closeModal(); this._openDetail(project);
      }
    };
    document.querySelectorAll("[data-phase-status]").forEach(sel => sel.onchange = async (e) => {
      await DB.update("project_phases", sel.dataset.phaseStatus, { status: e.target.value });
    });
    document.querySelectorAll("[data-phase-del]").forEach(b => b.onclick = async () => {
      await DB.remove("project_phases", b.dataset.phaseDel);
      closeModal(); this._openDetail(project);
    });

    // quick status/progress save on change
    document.getElementById("f-status").onchange = async (e) => { await DB.update("projects", project.id, { status: e.target.value }); };
    document.getElementById("f-progress").onchange = async (e) => { await DB.update("projects", project.id, { progress: Number(e.target.value) }); };
  },

  openNew() { this._openForm(null); },

  async _openForm(project) {
    const isEdit = !!project;
    project = project || {};
    const [projCats, people] = await Promise.all([getPickList("project_category"), getPickList("person")]);
    openModal(`
      <h3>${isEdit ? "Edit project" : "New project"}</h3>
      <div class="field"><label>Name</label><input id="f-name" value="${project.name || ""}" placeholder="Project name"></div>
      <div class="field"><label>Description</label><textarea id="f-desc">${project.description || ""}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Status</label>
          <select id="f-status">${KANBAN_COLUMNS.map(s => `<option value="${s}" ${project.status === s ? "selected" : ""}>${STATUS_LABELS[s]}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Priority</label>
          <select id="f-priority">${Object.entries(PRIORITY_LABELS).map(([k,v]) => `<option value="${k}" ${project.priority === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Start date</label><input id="f-start" type="date" value="${project.start_date || ""}"></div>
        <div class="field"><label>End date</label><input id="f-end" type="date" value="${project.end_date || ""}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Category</label>${categorySelectHtml("f-category", projCats, project.category || "")}</div>
        <div class="field"><label>Person in charge</label>${categorySelectHtml("f-person", people, project.person_in_charge || "")}</div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="f-cancel">Cancel</button>
        <button class="btn btn-primary" id="f-save">Save</button>
      </div>
    `);
    bindCategorySelect("f-category", "project_category");
    bindCategorySelect("f-person", "person");
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-save").onclick = async () => {
      const patch = {
        name: document.getElementById("f-name").value.trim(),
        description: document.getElementById("f-desc").value,
        status: document.getElementById("f-status").value,
        priority: document.getElementById("f-priority").value,
        start_date: document.getElementById("f-start").value || null,
        end_date: document.getElementById("f-end").value || null,
        category: document.getElementById("f-category").value,
        person_in_charge: document.getElementById("f-person").value
      };
      if (!patch.name) return alert("Give the project a name.");
      if (isEdit) await DB.update("projects", project.id, patch);
      else await DB.insert("projects", patch);
      closeModal();
      this.render();
    };
  }
};


// ===== render-goals.js =====
const GOAL_CATEGORIES = ["Career", "Personal Growth", "Financial", "Health & Wellness", "Learning & Development", "Home & Environment", "Relationships", "Community & Social Impact"];

const Goals = {
  async render() {
    const container = document.getElementById("view-goals");
    const [goals, steps] = await Promise.all([
      DB.list("goals", { order: "created_at", ascending: false }),
      DB.list("goal_steps", { order: "sort_order" })
    ]);
    this._goals = goals;
    this._steps = steps;

    const progressFor = (g) => {
      const gSteps = steps.filter(s => s.goal_id === g.id);
      if (gSteps.length) return Math.round((gSteps.filter(s => s.is_done).length / gSteps.length) * 100);
      return Number(g.progress || 0);
    };

    const byCategory = GOAL_CATEGORIES.map(cat => {
      const items = goals.filter(g => g.category === cat);
      const avg = items.length ? Math.round(items.reduce((s, g) => s + progressFor(g), 0) / items.length) : null;
      return { cat, items, avg };
    }).filter(c => c.items.length);
    const uncategorized = goals.filter(g => !GOAL_CATEGORIES.includes(g.category));

    container.innerHTML = `
      <div class="grid grid-2">
        ${byCategory.map(c => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:14px">
              <h3 style="font-size:14px">${c.cat}</h3>
              <span style="font-size:13px;font-weight:600;color:var(--accent-teal)">${c.avg}%</span>
            </div>
            <div class="list">
              ${c.items.map(g => {
                const pct = progressFor(g);
                const gSteps = steps.filter(s => s.goal_id === g.id);
                return `
                <div style="margin-bottom:12px" data-open="${g.id}">
                  <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:6px;cursor:pointer">
                    <span>${g.title}</span><span style="color:var(--text-muted)">${gSteps.length ? gSteps.filter(s=>s.is_done).length + "/" + gSteps.length + " steps" : pct + "%"}</span>
                  </div>
                  <div style="height:6px;border-radius:4px;background:var(--surface-2)"><div style="height:100%;border-radius:4px;width:${pct}%;background:var(--accent-teal)"></div></div>
                </div>`;
              }).join("")}
            </div>
          </div>
        `).join("")}
        ${uncategorized.length ? `<div class="card"><h3 style="font-size:14px;margin-bottom:14px">Other</h3><div class="list">${uncategorized.map(g => {
          const pct = progressFor(g);
          return `<div data-open="${g.id}" style="margin-bottom:12px;cursor:pointer">
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:6px"><span>${g.title}</span><span style="color:var(--text-muted)">${pct}%</span></div>
            <div style="height:6px;border-radius:4px;background:var(--surface-2)"><div style="height:100%;border-radius:4px;width:${pct}%;background:var(--accent-teal)"></div></div>
          </div>`;
        }).join("")}</div></div>` : ""}
      </div>
      ${!goals.length ? `<div class="empty-state">No goals yet — add your first one.</div>` : ""}
    `;

    container.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", () => this._detail(goals.find(g => g.id === el.dataset.open))));
  },

  _form(g) {
    const isEdit = !!g; g = g || { progress: 0, status: "in_progress" };
    openModal(`
      <h3>${isEdit ? "Edit" : "New"} goal</h3>
      <div class="field"><label>Title</label><input id="f-title" value="${g.title || ""}"></div>
      <div class="field"><label>Description</label><textarea id="f-desc">${g.description || ""}</textarea></div>
      <div class="field"><label>Category</label><select id="f-cat">${GOAL_CATEGORIES.map(c => `<option value="${c}" ${g.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field-row">
        <div class="field"><label>Progress % (manual — overridden by steps if you add any)</label><input id="f-progress" type="number" min="0" max="100" value="${g.progress || 0}"></div>
        <div class="field"><label>Target date</label><input id="f-date" type="date" value="${g.target_date || ""}"></div>
      </div>
      <div class="modal-actions">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete">Delete</button>` : ""}
        <button class="btn" id="f-cancel">Cancel</button>
        <button class="btn btn-primary" id="f-save">Save</button>
      </div>
    `);
    document.getElementById("f-cancel").onclick = closeModal;
    if (isEdit) document.getElementById("f-delete").onclick = async () => { await DB.remove("goals", g.id); closeModal(); Goals.render(); };
    document.getElementById("f-save").onclick = async () => {
      const patch = {
        title: document.getElementById("f-title").value.trim(),
        description: document.getElementById("f-desc").value,
        category: document.getElementById("f-cat").value,
        progress: Number(document.getElementById("f-progress").value || 0),
        target_date: document.getElementById("f-date").value || null
      };
      if (!patch.title) return alert("Give it a title.");
      if (isEdit) await DB.update("goals", g.id, patch); else await DB.insert("goals", patch);
      closeModal();
      Goals.render();
    };
  },

  async _detail(g) {
    const steps = await DB.list("goal_steps", { filters: { goal_id: g.id }, order: "sort_order" });
    openModal(`
      <h3>${g.title}</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-top:-8px">${g.description || "No description"}</p>
      <div class="section-title" style="margin-top:10px">Action steps</div>
      <div class="list" id="goal-steps-list" style="margin-bottom:12px">
        ${steps.length ? steps.map(s => `
          <div class="row" data-step="${s.id}">
            <div class="row-check ${s.is_done ? "checked" : ""}" data-step-check="${s.id}">✓</div>
            <div class="row-title ${s.is_done ? "done" : ""}">${s.title}</div>
            <button class="btn btn-sm btn-ghost" data-step-del="${s.id}">✕</button>
          </div>
        `).join("") : `<div class="empty-state">No steps yet — break this goal down into concrete actions.</div>`}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input id="new-step" placeholder="Add a step and press Enter" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px">
      </div>
      <div class="modal-actions">
        <button class="btn" id="f-close">Close</button>
        <button class="btn" id="f-edit">Edit goal</button>
      </div>
    `);
    document.getElementById("f-close").onclick = closeModal;
    document.getElementById("f-edit").onclick = () => { closeModal(); this._form(g); };
    document.getElementById("new-step").addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && e.target.value.trim()) {
        await DB.insert("goal_steps", { goal_id: g.id, title: e.target.value.trim(), sort_order: steps.length });
        closeModal();
        this._detail(g);
        this.render();
      }
    });
    document.querySelectorAll("[data-step-check]").forEach(chk => chk.addEventListener("click", async () => {
      const step = steps.find(s => s.id === chk.dataset.stepCheck);
      await DB.update("goal_steps", step.id, { is_done: !step.is_done });
      closeModal();
      this._detail(g);
      this.render();
    }));
    document.querySelectorAll("[data-step-del]").forEach(b => b.addEventListener("click", async () => {
      await DB.remove("goal_steps", b.dataset.stepDel);
      closeModal();
      this._detail(g);
      this.render();
    }));
  }
};


// ===== render-budget.js =====
const BUDGET_GROUPS = {
  income: "Income",
  bill: "Bill",
  expense: "Expense",
  savings: "Savings",
  subscription: "Subscription",
  debt: "Debt"
};

const Budget = {
  tab: "overview",

  async render() {
    const container = document.getElementById("view-budget");
    const [accounts, categories, tx, subs, debts, funds, investments, netWorth, settings] = await Promise.all([
      DB.list("bank_accounts", { order: "name" }),
      DB.list("budget_categories", { order: "name" }),
      DB.list("budget_transactions", { order: "transaction_date", ascending: false }),
      DB.list("subscriptions", { order: "next_due_date" }),
      DB.list("debts", { order: "due_date" }),
      DB.list("sinking_funds", { order: "name" }),
      DB.list("investments", { order: "entry_date", ascending: false }),
      DB.list("net_worth_snapshots", { order: "snapshot_date", ascending: false }),
      DB.getSettings()
    ]);
    this.data = { accounts, categories, tx, subs, debts, funds, investments, netWorth, settings };
    this._draw(container);
  },

  _draw(container) {
    const tabs = [
      ["overview", "Overview"], ["transactions", "Transactions"],
      ["bills", "Bills & Subscriptions"], ["debts", "Debts"],
      ["distribution", "50/30/20"], ["annual", "Annual"],
      ["savings", "Savings & Net Worth"], ["setup", "Setup"]
    ];
    container.innerHTML = `
      <div class="tabs">${tabs.map(([k, l]) => `<button class="tab-btn ${this.tab === k ? "active" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
      <div id="budget-body"></div>
    `;
    container.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { this.tab = b.dataset.tab; this._draw(container); }));
    const body = document.getElementById("budget-body");
    ({
      overview: () => this._overview(body),
      transactions: () => this._transactions(body),
      bills: () => this._bills(body),
      debts: () => this._debts(body),
      distribution: () => this._distribution(body),
      annual: () => this._annual(body),
      savings: () => this._savings(body),
      setup: () => this._setup(body)
    })[this.tab]();
  },

  // ---- carry-over math ----
  _categoryStats(cat) {
    const { tx, settings } = this.data;
    const carryOver = settings.budget_method === "carry_over" && cat.carry_over;
    const catTx = tx.filter(t => t.category_id === cat.id && t.transaction_type === "expense");
    const thisMonth = todayISO().slice(0, 7);
    const spentThisMonth = catTx.filter(t => t.transaction_date.startsWith(thisMonth)).reduce((s, t) => s + Number(t.amount), 0);

    let carried = 0;
    if (carryOver) {
      const months = [...new Set(catTx.map(t => t.transaction_date.slice(0, 7)))].filter(m => m < thisMonth);
      months.forEach(m => {
        const spent = catTx.filter(t => t.transaction_date.startsWith(m)).reduce((s, t) => s + Number(t.amount), 0);
        carried += Number(cat.planned_amount) - spent;
      });
    }
    const available = Number(cat.planned_amount) + carried - spentThisMonth;
    return { spentThisMonth, carried, available };
  },

  _overview(body) {
    const { categories, tx, accounts } = this.data;
    const thisMonth = todayISO().slice(0, 7);
    const monthTx = tx.filter(t => t.transaction_date.startsWith(thisMonth));
    const income = monthTx.filter(t => t.transaction_type === "income").reduce((s, t) => s + Number(t.amount), 0);
    const expense = monthTx.filter(t => t.transaction_type === "expense").reduce((s, t) => s + Number(t.amount), 0);
    const spendCats = categories.filter(c => c.group_type !== "income");
    const totalAvailable = spendCats.reduce((s, c) => s + this._categoryStats(c).available, 0);
    const totalPlanned = spendCats.reduce((s, c) => s + Number(c.planned_amount), 0);
    const totalBalance = accounts.reduce((s, a) => {
      const netTx = tx.filter(t => t.account_id === a.id).reduce((sum, t) => sum + (t.transaction_type === "income" ? Number(t.amount) : -Number(t.amount)), 0);
      return s + Number(a.starting_balance) + netTx;
    }, 0);

    body.innerHTML = `
      <div class="grid grid-4">
        <div class="card"><div class="stat-label">Account balance</div><div class="stat-value">${fmtMoney(totalBalance)}</div><div class="stat-sub">${accounts.length} account${accounts.length===1?"":"s"}</div></div>
        <div class="card"><div class="stat-label">Received</div><div class="stat-value">${fmtMoney(income)}</div></div>
        <div class="card"><div class="stat-label">Spent</div><div class="stat-value">${fmtMoney(expense)}</div></div>
        <div class="card"><div class="stat-label">Left to spend</div><div class="stat-value" style="color:${totalAvailable < 0 ? 'var(--accent-red)' : 'inherit'}">${fmtMoney(totalAvailable)}</div></div>
      </div>
      <div class="grid grid-2">
        <div>
          <div class="section-title" style="margin-top:0">By category <span style="font-weight:400;font-size:12px;color:var(--text-muted)">carry-over — unspent rolls forward</span></div>
          <div class="list">
            ${spendCats.length ? spendCats.map(c => {
          const s = this._categoryStats(c);
          const pct = c.planned_amount > 0 ? Math.min(100, Math.round((s.spentThisMonth / c.planned_amount) * 100)) : 0;
          return `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
            <div style="display:flex;justify-content:space-between">
              <span class="row-title">${c.name} <span style="font-weight:400;color:var(--text-muted)">· ${BUDGET_GROUPS[c.group_type]}</span></span>
              <span style="font-size:13px;font-weight:600;color:${s.available < 0 ? 'var(--accent-red)' : 'var(--accent-teal)'}">${fmtMoney(s.available)} left</span>
            </div>
            <div style="height:6px;border-radius:4px;background:var(--surface-2)"><div style="height:100%;border-radius:4px;width:${pct}%;background:${pct >= 100 ? 'var(--accent-red)' : 'var(--accent-blue)'}"></div></div>
            <div class="row-meta" style="font-size:11px">planned ${fmtMoney(c.planned_amount)} · spent ${fmtMoney(s.spentThisMonth)} ${s.carried ? `· carried ${fmtMoney(s.carried)}` : ""}</div>
          </div>`;
        }).join("") : `<div class="empty-state">Add a budget category in Setup to get started.</div>`}
          </div>
        </div>
        <div>
          <div class="section-title" style="margin-top:0">Spend this month</div>
          <div class="card" style="display:flex;gap:16px;align-items:center">
            ${svgDonut(spendCats.map((c, i) => ({
              label: c.name,
              value: this._categoryStats(c).spentThisMonth,
              color: ["var(--accent-blue)", "var(--accent-purple)", "var(--accent-teal)", "var(--accent-gold)", "var(--accent-red)", "var(--accent-pink)"][i % 6]
            })), 110)}
            ${chartLegend(spendCats.map((c, i) => ({
              label: c.name,
              value: this._categoryStats(c).spentThisMonth,
              color: ["var(--accent-blue)", "var(--accent-purple)", "var(--accent-teal)", "var(--accent-gold)", "var(--accent-red)", "var(--accent-pink)"][i % 6]
            })))}
          </div>
        </div>
      </div>
    `;
  },

  _transactions(body) {
    const { tx, categories, accounts } = this.data;
    body.innerHTML = `
      <div style="margin-bottom:14px"><button class="btn btn-primary" id="add-tx">+ New transaction</button></div>
      <div class="list">${tx.length ? tx.map(t => {
        const cat = categories.find(c => c.id === t.category_id);
        return `<div class="row">
          <div class="row-title" data-open="${t.id}" style="cursor:pointer;color:${t.transaction_type === 'income' ? 'var(--accent-teal)' : 'inherit'}">${t.transaction_type === 'income' ? '+' : '−'}${fmtMoney(t.amount)} ${t.description ? "· " + t.description : ""}</div>
          <div class="row-meta">${cat ? cat.name : "Uncategorized"} · ${fmtDate(t.transaction_date)}</div>
          <button class="btn btn-sm btn-ghost" data-dup="${t.id}" title="Repeat next month">↻ Next month</button>
        </div>`;
      }).join("") : `<div class="empty-state">No transactions logged yet.</div>`}</div>
    `;
    document.getElementById("add-tx").onclick = () => this._txForm(null);
    body.querySelectorAll("[data-open]").forEach(r => r.addEventListener("click", () => this._txForm(tx.find(t => t.id === r.dataset.open))));
    body.querySelectorAll("[data-dup]").forEach(b => b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const t = tx.find(x => x.id === b.dataset.dup);
      const { id, created_at, ...rest } = t;
      rest.transaction_date = advanceDate(t.transaction_date, "monthly");
      await DB.insert("budget_transactions", rest);
      Budget.render();
    }));
  },

  _txForm(t) {
    const isEdit = !!t; t = t || { transaction_type: "expense", transaction_date: todayISO() };
    const { categories, accounts } = this.data;
    openModal(`
      <h3>${isEdit ? "Edit" : "New"} transaction</h3>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="f-type"><option value="expense" ${t.transaction_type === 'expense' ? 'selected' : ''}>Expense</option><option value="income" ${t.transaction_type === 'income' ? 'selected' : ''}>Income</option></select></div>
        <div class="field"><label>Amount</label><input id="f-amount" type="number" step="0.01" value="${t.amount || ""}"></div>
      </div>
      <div class="field"><label>Description</label><input id="f-desc" value="${t.description || ""}"></div>
      <div class="field-row">
        <div class="field"><label>Category</label><select id="f-cat"><option value="">— None —</option>${categories.map(c => `<option value="${c.id}" ${t.category_id === c.id ? "selected" : ""}>${c.name}</option>`).join("")}</select></div>
        <div class="field"><label>Account</label><select id="f-acc"><option value="">— None —</option>${accounts.map(a => `<option value="${a.id}" ${t.account_id === a.id ? "selected" : ""}>${a.name}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Date</label><input id="f-date" type="date" value="${t.transaction_date}"></div>
      <div class="modal-actions">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete">Delete</button>` : ""}
        <button class="btn" id="f-cancel">Cancel</button>
        <button class="btn btn-primary" id="f-save">Save</button>
      </div>
    `);
    document.getElementById("f-cancel").onclick = closeModal;
    if (isEdit) document.getElementById("f-delete").onclick = async () => { await DB.remove("budget_transactions", t.id); closeModal(); Budget.render(); };
    document.getElementById("f-save").onclick = async () => {
      const patch = {
        transaction_type: document.getElementById("f-type").value,
        amount: Number(document.getElementById("f-amount").value || 0),
        description: document.getElementById("f-desc").value,
        category_id: document.getElementById("f-cat").value || null,
        account_id: document.getElementById("f-acc").value || null,
        transaction_date: document.getElementById("f-date").value
      };
      if (!patch.amount) return alert("Enter an amount.");
      if (isEdit) await DB.update("budget_transactions", t.id, patch);
      else await DB.insert("budget_transactions", patch);
      closeModal(); Budget.render();
    };
  },

  _bills(body) {
    const { subs } = this.data;
    body.innerHTML = `
      <div style="margin-bottom:14px"><button class="btn btn-primary" id="add-sub">+ New bill / subscription</button></div>
      <div class="list">${subs.length ? subs.map(s => `
        <div class="row">
          <div class="row-title">${s.name} <span style="color:var(--text-muted);font-weight:400">· ${fmtMoney(s.amount)} / ${s.billing_cycle}</span></div>
          <div class="row-meta">${s.next_due_date ? "next " + fmtDate(s.next_due_date) : ""}</div>
          <button class="btn btn-sm" data-pay="${s.id}">Log payment</button>
          <button class="btn btn-sm btn-ghost" data-edit="${s.id}">Edit</button>

  _payoffMonths(remaining, annualRate, payment) {
    const r = (annualRate || 0) / 100 / 12;
    if (payment <= 0) return null;
    if (r === 0) return Math.ceil(remaining / payment);
    if (payment <= remaining * r) return null; // payment never covers interest
    const months = Math.log(payment / (payment - remaining * r)) / Math.log(1 + r);
    return Math.ceil(months);
  },

  _distribution(body) {

    const targets = { needs: 50, wants: 30, savings: 20 };

      const catsInBucket = categories.filter(c => (c.budget_bucket || "wants") === b);
      spentByBucket[b] = tx.filter(t => t.transaction_type === "expense" && t.transaction_date.startsWith(thisMonth) && catsInBucket.some(c => c.id === t.category_id))
        .reduce((s, t) => s + Number(t.amount), 0);
    });

    body.innerHTML = `
      <div class="grid grid-3">

  _annual(body) {
    const { tx } = this.data;
    const year = new Date().getFullYear();
    const months = Array.from({ length: 12 }, (_, i) => {
      const key = `${year}-${String(i + 1).padStart(2, "0")}`;
      const monthTx = tx.filter(t => t.transaction_date.startsWith(key));
      const income = monthTx.filter(t => t.transaction_type === "income").reduce((s, t) => s + Number(t.amount), 0);
      const expense = monthTx.filter(t => t.transaction_type === "expense").reduce((s, t) => s + Number(t.amount), 0);
      return { label: new Date(year, i, 1).toLocaleDateString(undefined, { month: "short" }), income, expense, net: income - expense };
    });
    const totalIncome = months.reduce((s, m) => s + m.income, 0);
    const totalExpense = months.reduce((s, m) => s + m.expense, 0);

    body.innerHTML = `
      <div class="grid grid-3" style="margin-bottom:20px">
        <div class="card"><div class="stat-label">Total income ${year}</div><div class="stat-value">${fmtMoney(totalIncome)}</div></div>
        <div class="card"><div class="stat-label">Total expenses ${year}</div><div class="stat-value">${fmtMoney(totalExpense)}</div></div>
        <div class="card"><div class="stat-label">Net ${year}</div><div class="stat-value" style="color:${totalIncome-totalExpense<0?'var(--accent-red)':'var(--accent-teal)'}">${fmtMoney(totalIncome - totalExpense)}</div></div>
      </div>
      <div class="card">
        ${svgBar(months.map(m => ({ label: m.label, value: m.income, color: "var(--accent-teal)" })), 560, 130)}
      </div>
      <div class="section-title">Month by month</div>
      <div class="list">
        ${months.map(m => `<div class="row"><div class="row-title">${m.label}</div><div class="row-meta">${fmtMoney(m.income)} in · ${fmtMoney(m.expense)} out · <span style="color:${m.net<0?'var(--accent-red)':'var(--accent-teal)'}">${fmtMoney(m.net)} net</span></div></div>`).join("")}
      </div>
    `;
  },

function weekDates(offsetWeeks = 0) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + (day === 0 ? -6 : 1) + offsetWeeks * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d.toISOString().slice(0, 10);
  });
}

    const [tasks, projects, events, bh, tx, blocks, meals] = await Promise.all([
      DB.list("tasks"),
      DB.list("projects"),
      DB.list("calendar_events"),
      DB.list("birthdays_holidays"),
      DB.list("budget_transactions"),
      DB.list("time_blocks"),
      DB.list("meals")
    ]);
    this._data = { tasks, projects, events, bh, tx, blocks, meals };
    if (this.mode === "day") this._drawDay(container);
    else if (this.mode === "week") this._drawWeek(container);
    else this._draw(container);
  },

  _modeTabs() {
    return `<div class="tabs" style="margin-bottom:0;border-bottom:none">
      <button class="tab-btn ${this.mode === 'month' ? 'active' : ''}" data-cal-mode="month">Month</button>
      <button class="tab-btn ${this.mode === 'week' ? 'active' : ''}" data-cal-mode="week">Week</button>
    </div>`;
  },
  _bindModeTabs(container) {
    container.querySelectorAll("[data-cal-mode]").forEach(b => b.addEventListener("click", () => {
      this.mode = b.dataset.calMode;
      this.render();
    }));
  },

  _topActions() {
    return `
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" id="cal-manage-bh">Birthdays &amp; holidays</button>
        <button class="btn btn-sm btn-primary" id="cal-add-event">+ Event</button>
      </div>`;
  },

  _bindTopActions(container) {
    const bh = container.querySelector("#cal-manage-bh");
    const ev = container.querySelector("#cal-add-event");
    if (bh) bh.onclick = () => this._manageBirthdays();
    if (ev) ev.onclick = () => this._eventForm(this.selectedDate);
  },

  _draw(container) {
    const year = this.cursor.getFullYear();
    const month = this.cursor.getMonth();
    const monthName = this.cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    const firstOfMonth = new Date(year, month, 1);
    const startDow = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const cells = [];
    for (let i = startDow - 1; i >= 0; i--) cells.push({ day: daysInPrevMonth - i, other: true, date: new Date(year, month - 1, daysInPrevMonth - i) });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, other: false, date: new Date(year, month, d) });
    while (cells.length % 7 !== 0) {
      const idx = cells.length - (startDow + daysInMonth);
      cells.push({ day: idx + 1, other: true, date: new Date(year, month + 1, cells.length - startDow - daysInMonth + 1) });
    }

    const todayStr = todayISO();
    const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    container.innerHTML = `
      ${this._modeTabs()}
      <div class="calendar-nav" style="justify-content:space-between;margin:14px 0 16px">
        <div class="calendar-nav"><button class="btn btn-sm" id="cal-prev">← Prev</button><h2>${monthName}</h2><button class="btn btn-sm" id="cal-next">Next →</button></div>
        ${this._topActions()}
      </div>
      <div class="calendar-grid">
        ${dow.map(d => `<div class="calendar-dow">${d}</div>`).join("")}
        ${cells.map(c => this._cellHtml(c, todayStr)).join("")}
      </div>
    `;

    this._bindModeTabs(container);
    document.getElementById("cal-prev").onclick = () => { this.cursor = new Date(year, month - 1, 1); this._draw(container); };
    document.getElementById("cal-next").onclick = () => { this.cursor = new Date(year, month + 1, 1); this._draw(container); };
    this._bindTopActions(container);
    container.querySelectorAll("[data-cell]").forEach(cell => cell.addEventListener("click", () => {
      this.selectedDate = cell.dataset.cell;
      this.mode = "day";
      this._drawDay(container);
    }));
  },

  // ---- WEEK VIEW ----
  _drawWeek(container) {
    const days = weekDates(this._weekOffset || 0);
    const todayStr = todayISO();
    const dowFull = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    // weekDates() returns Mon-Sun; reorder label lookup accordingly
    const labelFor = (iso) => { const d = new Date(iso + "T00:00:00"); return dowFull[d.getDay()]; };

    container.innerHTML = `
      ${this._modeTabs()}
      <div class="calendar-nav" style="justify-content:space-between;margin:14px 0 16px">
        <div class="calendar-nav">
          <button class="btn btn-sm" id="week-prev">← Prev</button>
          <h2>${fmtDate(days[0])} – ${fmtDate(days[6])}</h2>
          <button class="btn btn-sm" id="week-next">Next →</button>
        </div>
        ${this._topActions()}
      </div>
      <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:10px">
        ${days.map(iso => {
          const items = this._eventsForDate(iso);
          return `<div class="card" style="padding:12px;min-height:160px;${iso === todayStr ? 'box-shadow:inset 0 0 0 2px var(--accent-blue)' : ''}" data-cell="${iso}">
            <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">${labelFor(iso).slice(0,3)}</div>
            <div style="font-size:15px;font-weight:600;margin-bottom:8px">${new Date(iso+"T00:00:00").getDate()}</div>
            <div style="display:flex;flex-direction:column;gap:4px">
              ${items.map(i => `<div class="calendar-event" style="background:${i.color}22;color:${i.color}">${i.label}</div>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
    `;
    this._bindModeTabs(container);
    document.getElementById("week-prev").onclick = () => { this._weekOffset = (this._weekOffset || 0) - 1; this._drawWeek(container); };
    document.getElementById("week-next").onclick = () => { this._weekOffset = (this._weekOffset || 0) + 1; this._drawWeek(container); };
    this._bindTopActions(container);
    container.querySelectorAll("[data-cell]").forEach(cell => cell.addEventListener("click", () => {
      this.selectedDate = cell.dataset.cell;
      this.mode = "day";
      this._drawDay(container);
    }));
  },

  _eventsForDate(iso) {
    const { tasks, projects, events, bh, tx } = this._data;
    const items = [];
    tasks.forEach(t => { if (t.due_date === iso) items.push({ label: t.title, color: "var(--accent-blue)" }); });
    projects.forEach(p => { if (p.end_date === iso) items.push({ label: p.name + " due", color: "var(--accent-purple)" }); });
    events.forEach(e => { if (e.event_date === iso) items.push({ label: e.title, color: "var(--accent-teal)" }); });
    bh.forEach(b => {
      const bDate = new Date(b.event_date + "T00:00:00");
      const target = new Date(iso + "T00:00:00");
      const match = b.is_recurring_yearly
        ? (bDate.getMonth() === target.getMonth() && bDate.getDate() === target.getDate())
        : b.event_date === iso;
      if (match) items.push({ label: b.name, color: "var(--accent-pink)" });
    });
    tx.forEach(t => { if (t.transaction_date === iso) items.push({ label: (t.transaction_type === 'income' ? '+' : '-') + fmtMoney(t.amount), color: "var(--accent-gold)" }); });
    return items;
  },

  _cellHtml(c, todayStr) {
    const iso = c.date.toISOString().slice(0, 10);
    const items = this._eventsForDate(iso);
    return `
      <div class="calendar-cell ${c.other ? "other-month" : ""} ${iso === todayStr ? "today" : ""}" data-cell="${iso}" style="cursor:pointer">
        <div class="calendar-date">${c.day}</div>
        ${items.slice(0, 3).map(i => `<div class="calendar-event" style="background:${i.color}22;color:${i.color}">${i.label}</div>`).join("")}
        ${items.length > 3 ? `<div style="font-size:10px;color:var(--text-muted)">+${items.length - 3} more</div>` : ""}
      </div>`;
  },

  // ---- DAY VIEW / TIME BLOCKING ----
  _drawDay(container) {
    const { tasks, meals, blocks } = this._data;
    const iso = this.selectedDate;
    const dayTasks = tasks.filter(t => t.due_date === iso);
    const dayMeals = meals.filter(m => m.meal_date === iso);
    const dayBlocks = blocks.filter(b => b.block_date === iso).sort((a, b) => (a.start_time || "").localeCompare(b.start_time || ""));

    container.innerHTML = `
      <div class="calendar-nav" style="justify-content:space-between;margin-bottom:16px">
        <div class="calendar-nav"><button class="btn btn-sm" id="day-back">← Month</button><h2>${fmtDateLong(iso)}</h2></div>
        ${this._topActions()}
      </div>
      <div class="grid grid-2">
        <div>
          <div class="section-title" style="margin-top:0">Time blocks <button class="btn btn-sm" id="add-block">+ Add</button></div>
          <div class="list">${dayBlocks.length ? dayBlocks.map(b => `
            <div class="row"><div class="row-title">${b.label || "(untitled)"}</div><div class="row-meta">${b.start_time || ""}${b.end_time ? " – " + b.end_time : ""}</div></div>
          `).join("") : `<div class="empty-state">Nothing scheduled.</div>`}</div>
        </div>
        <div>
          <div class="section-title" style="margin-top:0">Tasks due</div>
          <div class="list">${dayTasks.length ? dayTasks.map(t => `<div class="row">${statusBadge(t.status)}<div class="row-title">${t.title}</div></div>`).join("") : `<div class="empty-state">None due.</div>`}</div>
          <div class="section-title">Meals</div>
          <div class="list">${dayMeals.length ? dayMeals.map(m => `<div class="row"><div class="row-title">${m.description || m.meal_type}</div><div class="row-meta">${m.meal_type}</div></div>`).join("") : `<div class="empty-state">Nothing planned.</div>`}</div>
        </div>
      </div>
    `;
    document.getElementById("day-back").onclick = () => { this.mode = "month"; this._draw(container); };
    document.getElementById("add-block").onclick = () => this._blockForm(iso);
    this._bindTopActions(container);
  },

  _blockForm(date) {
    openModal(`<h3>New time block</h3>
      <div class="field"><label>Label</label><input id="f-label" placeholder="e.g. Deep work"></div>
      <div class="field-row"><div class="field"><label>Start</label><input id="f-start" type="time"></div><div class="field"><label>End</label><input id="f-end" type="time"></div></div>
      <div class="modal-actions"><button class="btn" id="f-cancel">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-save").onclick = async () => {
      await DB.insert("time_blocks", { block_date: date, label: document.getElementById("f-label").value, start_time: document.getElementById("f-start").value || null, end_time: document.getElementById("f-end").value || null });
      closeModal(); Calendar.render();
    };
  },

  _eventForm(date) {
    openModal(`<h3>New event</h3>
      <div class="field"><label>Title</label><input id="f-title"></div>
      <div class="field"><label>Date</label><input id="f-date" type="date" value="${date}"></div>
      <div class="modal-actions"><button class="btn" id="f-cancel">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-save").onclick = async () => {
      const title = document.getElementById("f-title").value.trim();
      if (!title) return alert("Give it a title.");
      await DB.insert("calendar_events", { title, event_date: document.getElementById("f-date").value });
      closeModal(); Calendar.render();
    };
  },

  async _manageBirthdays() {
    const bh = await DB.list("birthdays_holidays", { order: "event_date" });
    openModal(`
      <h3>Birthdays &amp; holidays</h3>
      <div class="list" style="margin-bottom:16px;max-height:220px;overflow-y:auto">
        ${bh.length ? bh.map(b => `<div class="row"><div class="row-title">${b.name}</div><div class="row-meta">${fmtDate(b.event_date)} · ${b.event_type}</div><button class="btn btn-sm btn-ghost" data-del="${b.id}">Remove</button></div>`).join("") : `<div class="empty-state">None yet.</div>`}
      </div>
      <div class="field"><label>Name</label><input id="f-name"></div>
      <div class="field-row">
        <div class="field"><label>Date</label><input id="f-date" type="date"></div>
        <div class="field"><label>Type</label><select id="f-type"><option value="birthday">Birthday</option><option value="holiday">Holiday</option></select></div>
      </div>
      <div class="modal-actions"><button class="btn" id="f-cancel">Close</button><button class="btn btn-primary" id="f-save">Add</button></div>
    `);
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-save").onclick = async () => {
      const name = document.getElementById("f-name").value.trim();
      const event_date = document.getElementById("f-date").value;
      if (!name || !event_date) return alert("Name and date needed.");
      await DB.insert("birthdays_holidays", { name, event_date, event_type: document.getElementById("f-type").value });
      closeModal(); this._manageBirthdays();
    };
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => { await DB.remove("birthdays_holidays", b.dataset.del); closeModal(); this._manageBirthdays(); }));
  }
};
