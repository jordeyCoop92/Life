<style>
/* Layout: one ledger column — black hairlines, uppercase spaced labels, Helvetica throughout. A single white look, by request. */

.seg{display:flex;border:1px solid var(--ink)}

.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
.inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.toggle{display:flex;align-items:center;gap:10px;font:400 15px var(--sans)!important;text-transform:none!important;letter-spacing:0!important;min-height:40px}

.picks{display:flex;flex-wrap:wrap;gap:6px}

#fab{position:fixed;z-index:30;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;background:var(--ink);color:var(--bg);font:300 32px/1 var(--sans);display:grid;place-items:center}

#toast button{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;text-decoration:underline;min-height:30px}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>

<body>

<div id="app" class="page"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
const TZ = 'Asia/Dubai';

function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function fmtD(dt) { return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); }

/* ---------- data ---------- */
const all = () => [...S.entries.values()];

const colName = slug => (S.cols.get(slug) || {}).name || slug;
const sortedCols = () => [...S.cols.values()].sort((a, b) => a.name.localeCompare(b.name));
const status = e => e.status || 'open';

function whereLabel(e) {
  if (e.kind === 'event') return e.startDate ? shortDay(e.startDate) : 'Calendar';
  if (e.date) return shortDay(e.date);

function occursOn(e, d) {
  if (e.kind !== 'event' || e.deleted || !isDate(e.startDate)) return false;

    : rep === 'biweekly' ? diffDays(e.startDate, s) % 14 === 0

}
function byTime(a, b) {

}
const eventsOn = d => liveE().filter(e => occursOn(e, d)).sort(byTime);

}
let loading = null;
async function load() {
  if (!sb || loading) return loading;
  loading = (async () => {
    try {
      await Promise.all([...chains.values()]);
      const [rows, cols] = await Promise.all([fetchAll('journal_entries', 'id,doc'), fetchAll('journal_collections', 'slug,name,created_at')]);
      const m = new Map(); rows.forEach(r => m.set(r.id, Object.assign({}, r.doc, {id: r.id})));
      const c = new Map(); cols.forEach(r => c.set(r.slug, {slug: r.slug, name: r.name, createdAt: r.created_at}));
      S.entries = m; S.cols = c; S.mode = 'live';
    } catch (e) { if (S.mode !== 'live') S.mode = 'error'; }
    loading = null;
    render();
  })();
  return loading;
}
function commit(prev, next, msg) {
  if (next) writeEntry(next); else if (prev) purgeEntry(prev.id);
  const p = prev ? clone(prev) : null, nid = next ? next.id : null;
  toast(msg, () => { if (p) writeEntry(p); else if (nid) purgeEntry(nid); });
}
function toggleTask(e) {
  const n = clone(e);
  n.status = (status(e) === 'open') ? 'done' : 'open';
  n.doneAt = n.status === 'done' ? nowISO() : null;
  commit(e, n, n.status === 'done' ? 'Marked done' : 'Reopened');
}
function moveEntry(e, target) {
  const from = e.date || e.month || 'unscheduled';
  const to = target.date || target.month || 'unscheduled';
  if (from === to) { toast("It's already there"); return; }
  const n = clone(e);
  n.date = target.date || null;
  n.month = target.date ? null : (target.month || null);
  n.history = (e.history || []).concat([{from, to, at: nowISO()}]);
  commit(e, n, 'Moved to ' + whereLabel(n));
}
function softDelete(e) {
  const n = clone(e); n.deleted = true; n.deletedAt = nowISO();
  commit(e, n, 'Moved to Recently deleted');
}

/* ---------- toast & sheet ---------- */
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" id="undo">Undo</button>' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  if (undo) $('#undo').onclick = () => { t.hidden = true; undo(); };
  toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 6500 : 3500);
}
function openSheet(inner, label) {
  const root = $('#sheet-root');
  root.innerHTML = '<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(label) + '"><div class="sheet-in"><div class="grab"></div>' + inner + '</div></div>';
  root.hidden = false;
  document.body.classList.add('locked');
  setTimeout(() => { const f = root.querySelector('[data-autofocus]'); if (f) { try { f.focus(); } catch (e) {} } }, 80);
}
function closeSheet() {
  const root = $('#sheet-root'); root.innerHTML = ''; root.hidden = true; S.sheet = null;
  document.body.classList.remove('locked');
}
function showErr(msg) { const el = $('#s-err'); if (el) { el.textContent = msg; el.hidden = false; } }

function monthOptions(selected, from) {
  const start = from || todayStr().slice(0, 7);
  let o = '';
  for (let i = 0; i < 25; i++) { const ym = addMonths(start, i); o += '<option value="' + ym + '"' + (ym === selected ? ' selected' : '') + '>' + monthName(ym) + '</option>'; }
  if (selected && isYM(selected) && selected < start) o = '<option value="' + selected + '" selected>' + monthName(selected) + '</option>' + o;
  return o;
}
function pickerHtml(set) {
  const cols = sortedCols();
  return '<div class="picks">' + cols.map(c => '<button type="button" class="chip-toggle" data-act="pick" data-slug="' + esc(c.slug) + '" aria-pressed="' + set.has(c.slug) + '">' + esc(c.name) + '</button>').join('') + '</div>' +
    '<div class="inline" style="margin-top:8px"><input type="text" id="newcol" placeholder="New collection" maxlength="40" aria-label="New collection name"><button type="button" class="btn ghost small" data-act="newcol">Add</button></div>';
}
function refreshPicker() { const el = $('#picker'); if (el && S.sheet) el.innerHTML = pickerHtml(S.sheet.cols); }
function addNewCol() {
  const inp = $('#newcol'); if (!inp) return;
  const name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name) return;
  const existing = sortedCols().find(c => c.name.toLowerCase() === name.toLowerCase());
  let slug;
  if (existing) slug = existing.slug;
  else { slug = slugify(name); if (S.cols.has(slug)) slug += '-' + Date.now().toString(36).slice(-3); writeCol({slug, name, createdAt: nowISO()}); }
  if (S.sheet && S.sheet.cols) { S.sheet.cols.add(slug); refreshPicker(); }
}

function eventFields(e) {
  const rep = e.repeat || 'none', tz = e.tz || TZ;
  const opt = (v, l, cur) => '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + l + '</option>';
  const timeHidden = e.allDay ? ' hidden' : '';
  return '<div class="field"><label class="toggle"><input type="checkbox" id="ev-allday"' + (e.allDay ? ' checked' : '') + '> All day</label></div>' +
    '<div class="pair"><div class="field"><label for="ev-sd">Starts</label><input type="date" id="ev-sd" value="' + esc(e.startDate || todayStr()) + '"></div>' +

    '<div class="pair"><div class="field"><label for="ev-ed">Ends</label><input type="date" id="ev-ed" value="' + esc(e.endDate || e.startDate || todayStr()) + '"></div>' +
    '<div class="field ev-time"' + timeHidden + '><label for="ev-et">End time</label><input type="time" id="ev-et" value="' + esc(e.endTime || '') + '"></div></div>' +
    '<div class="pair"><div class="field"><label for="ev-rep">Repeats</label><select id="ev-rep">' + opt('none', 'Never', rep) + opt('daily', 'Every day', rep) + opt('weekly', 'Every week', rep) + opt('biweekly', 'Every 2 weeks', rep) + opt('monthly', 'Every month', rep) + opt('yearly', 'Every year', rep) + '</select></div>' +
    '<div class="field"><label for="ev-tz">Time zone</label><select id="ev-tz">' + opt('Asia/Dubai', 'Dubai', tz) + opt('Europe/London', 'London', tz) + '</select></div></div>' +
    '<div class="field"><label for="ev-loc">Location</label><input type="text" id="ev-loc" maxlength="200" value="' + esc(e.location || '') + '"></div>' +
    '<div class="field"><label for="ev-notes">Notes</label><textarea id="ev-notes">' + esc(e.body || '') + '</textarea></div>';
}
function readEvent() {
  const allDay = $('#ev-allday').checked, sd = $('#ev-sd').value, ed = $('#ev-ed').value || sd, st = $('#ev-st').value, et = $('#ev-et').value;
  if (!isDate(sd)) return {error: 'Choose a start date.'};
  if (!isDate(ed) || ed < sd) return {error: 'The end date is before the start date.'};
  if (!allDay && !st) return {error: 'Add a start time, or turn on All day.'};
  if (!allDay && et && ed === sd && et <= st) return {error: 'The end time is before the start time.'};
  return {data: {allDay, startDate: sd, endDate: ed, startTime: allDay ? null : st, endTime: allDay ? null : (et || null),
    repeat: $('#ev-rep').value, tz: $('#ev-tz').value, location: $('#ev-loc').value.trim(), body: $('#ev-notes').value}};
}

function openCapture(d) {
  d = d || {};
  const t = todayStr();
  S.sheet = {type: 'capture', kind: d.kind || 'task', when: d.when || 'day', cols: new Set(d.col ? [d.col] : [])};
  const segK = k => '<button type="button" data-act="k" data-k="' + k + '" aria-pressed="' + (S.sheet.kind === k) + '">' + ({task: '• Task', note: '– Note', event: '○ Event'}[k]) + '</button>';
  const segW = (w, l) => '<button type="button" data-act="w" data-w="' + w + '" aria-pressed="' + (S.sheet.when === w) + '">' + l + '</button>';
  const isEv = S.sheet.kind === 'event';
  openSheet(
    '<h2>Add to journal</h2>' +
    '<div class="seg" role="group" aria-label="Type">' + segK('task') + segK('note') + segK('event') + '</div>' +
    '<div class="field"><label for="c-title">What</label><input id="c-title" class="big-input" type="text" maxlength="240" autocomplete="off" placeholder="Write it down" data-autofocus></div>' +
    '<div id="c-tn"' + (isEv ? ' hidden' : '') + '>' +
      '<div class="field"><span>When</span><div class="seg" role="group" aria-label="When">' + segW('day', 'A day') + segW('month', 'A month') + segW('later', 'No date') + '</div></div>' +
      '<div class="field" id="c-w-day"' + (S.sheet.when === 'day' ? '' : ' hidden') + '><label for="c-date">Day</label><input type="date" id="c-date" value="' + esc(d.date || t) + '"></div>' +
      '<div class="field" id="c-w-month"' + (S.sheet.when === 'month' ? '' : ' hidden') + '><label for="c-month">Month</label><select id="c-month">' + monthOptions(d.month || t.slice(0, 7)) + '</select></div>' +
      '<div class="field" id="c-body-f"' + (S.sheet.kind === 'note' ? '' : ' hidden') + '><label for="c-body">Note</label><textarea id="c-body" placeholder="Optional. Start a line with # for a heading, - for a list, - [ ] for a checkbox."></textarea></div>' +
    '</div>' +

function submitCapture() {
  const s = S.sheet, title = $('#c-title').value.trim();
  if (!title) { showErr('Write something first.'); return; }
  const e = {id: newId(), kind: s.kind, title, collections: [...s.cols], createdAt: nowISO(), history: []};
  if (s.kind === 'event') {
    const r = readEvent(); if (r.error) { showErr(r.error); return; }
    Object.assign(e, r.data);
  } else {
    if (s.when === 'day') { const d = $('#c-date').value; if (!isDate(d)) { showErr('Choose a day.'); return; } e.date = d; e.month = null; }
    else if (s.when === 'month') { e.date = null; e.month = $('#c-month').value; }
    else { e.date = null; e.month = null; }
    if (s.kind === 'task') e.status = 'open';
    if (s.kind === 'note') e.body = $('#c-body').value;
  }
  closeSheet();
  commit(null, e, 'Added to ' + whereLabel(e));
}

function moveFields(e) {

    '<div class="inline" style="margin-top:8px"><select id="m-month" aria-label="Month">' + monthOptions(e.month || nextYM) + '</select><button type="button" class="btn ghost small" data-act="m-month">Move to month</button></div>' +
    '<div style="margin-top:8px"><button type="button" class="btn ghost small" data-act="m-later">Future log, no date</button></div></div>';

}

/* ---------- rows ---------- */
function sigOf(e) { return e.kind === 'note' ? '–' : e.kind === 'event' ? '○' : status(e) === 'done' ? '×' : '•'; }
function chipsHtml(list) {
  if (!list || !list.length) return '';
  return '<span class="chips">' + list.map(s => '<span class="chip">' + esc(colName(s)) + '</span>').join('') + '</span>';
}
function firstLine(body) {
  return ((body || '').split('\n').map(l => l.replace(/^\s*#+\s*/, '').replace(/^\s*[-*]\s*(\[[ xX]\]\s*)?/, '').trim()).filter(Boolean)[0]) || '';
}
function openAttrs(e) { return e.kind === 'note' ? 'data-go="n-' + esc(e.id) + '"' : 'data-act="open" data-id="' + esc(e.id) + '"'; }
function rowEntry(e, o) {
  o = o || {};
  const cls = 'row ' + e.kind + (e.kind === 'task' ? ' ' + status(e) : '');
  const sig = e.kind === 'task'
    ? '<button class="sig" type="button" data-act="toggle" data-id="' + esc(e.id) + '" aria-label="' + (status(e) === 'open' ? 'Mark done' : 'Reopen') + ': ' + esc(e.title) + '">' + sigOf(e) + '</button>'
    : '<span class="sig" aria-hidden="true">' + sigOf(e) + '</span>';
  let sub = '';
  if (e.kind === 'event') sub = '<span class="preview">' + esc(eventWhen(e)) + (e.location ? ' · ' + esc(e.location) : '') + '</span>';
  else if (e.kind === 'note' && e.body) sub = '<span class="preview">' + esc(firstLine(e.body)) + '</span>';
  const third = o.extra ? o.extra : o.meta ? '<span class="meta">' + esc(o.meta) + '</span>' : '<span></span>';
  return '<li class="' + cls + '">' + sig + '<button class="rtitle" type="button" ' + openAttrs(e) + '><span class="t">' + esc(e.title || 'Untitled') + '</span>' + sub + chipsHtml(e.collections) + '</button>' + third + '</li>';
}
function rowGhost(g) {
  const toDay = isDate(g.h.to);
  const where = toDay ? shortDay(g.h.to) : isYM(g.h.to) ? monthName(g.h.to) : 'Future log';
  return '<li class="row ghost"><span class="sig" aria-hidden="true">' + (toDay ? '&gt;' : '&lt;') + '</span><button class="rtitle" type="button" ' + openAttrs(g.e) + '><span class="t">' + esc(g.e.title) + '</span><span class="preview">Moved to ' + esc(where) + '</span></button><span></span></li>';
}
function emptyText(msg) { return '<p class="empty">' + (S.mode === 'connecting' ? 'Opening your journal…' : msg) + '</p>'; }

/* ---------- pages ---------- */
function topbar(left, nav) { return '<div class="topbar"><div>' + left + '</div>' + (nav ? '<div class="nav">' + nav + '</div>' : '') + '</div>'; }
const backIndex = '<a href="#index" data-go="index">‹ Index</a>';

function pageIndex() {
  const t = todayStr(), ym = t.slice(0, 7);
  const L = liveE();
  const months = new Set([ym]);
  L.forEach(e => {
    [e.date && e.date.slice(0, 7), e.month, e.kind === 'event' && e.startDate && e.startDate.slice(0, 7), e.createdAt && e.createdAt.slice(0, 7)]
      .forEach(m => { if (isYM(m) && m <= ym) months.add(m); });
  });
  const countIn = m => L.filter(e => (e.date && e.date.startsWith(m)) || (!e.date && e.month === m) || (e.kind === 'event' && e.startDate && e.startDate.startsWith(m))).length;
  const todayCount = dayItems(t).length + eventsOn(t).length;
  const deleted = all().filter(e => e.deleted).length;
  const item = (tok, name, sub, n) => '<li><a href="#' + tok + '" data-go="' + tok + '"><span class="name">' + name + (sub ? '<small>' + sub + '</small>' : '') + '</span><span class="lead"></span><span class="n">' + n + '</span></a></li>';
  const statusLine = S.mode === 'live' ? 'Saved automatically' : S.mode === 'connecting' ? 'Opening your journal…' : '';
  return topbar('Life HQ', '<a href="#search" data-go="search" style="font-size:12px;padding:0 4px">Search</a>') +
    '<h1 class="title-xl">Index</h1>' +
    '<p class="kicker">' + esc(longDay(t)) + ' · Dubai</p>' +
    '<div class="section"><ul class="toc">' +
      item('day-' + t, 'Today', esc(shortDay(t)), todayCount) +
      item('calendar', 'Calendar', 'Events and appointments', eventsUpcoming(30).length) +
      item('future', 'Future log', 'Later, by month', futureItems().filter(e => status(e) === 'open' || e.kind === 'note').length) +
      item('collections', 'Collections', S.cols.size ? sortedCols().slice(0, 3).map(c => esc(c.name)).join(', ') + (S.cols.size > 3 ? '…' : '') : 'Group entries by subject', S.cols.size) +
    '</ul></div>' +
    '<div class="section"><p class="label">Months</p><ul class="toc months">' +
      [...months].sort().reverse().map(m => item('month-' + m, esc(monthName(m)), m === ym ? 'This month' : '', countIn(m))).join('') +
    '</ul></div>' +
    '<div class="section linkrow">' +
      '<a class="btn ghost small" href="#deleted" data-go="deleted">Recently deleted' + (deleted ? ' (' + deleted + ')' : '') + '</a>' +
      '<button type="button" class="btn ghost small" data-act="export">Save a copy</button>' +
      '<button type="button" class="btn ghost small" data-act="signout">Sign out</button>' +
    '</div>' +
    (statusLine ? '<p class="status">' + statusLine + '</p>' : '');
}

function pageDay(d) {
  const t = todayStr(), dt = parseD(d), ym = d.slice(0, 7);
  const evs = eventsOn(d), items = dayItems(d), ghosts = ghostsOn(d);
  const earlier = d === t ? liveE().filter(e => e.kind === 'task' && status(e) === 'open' && e.date && e.date < t).sort((a, b) => a.date.localeCompare(b.date)) : [];
  const prev = addDays(d, -1), next = addDays(d, 1);
  let h = topbar(backIndex + ' <span aria-hidden="true">·</span> <a href="#month-' + ym + '" data-go="month-' + ym + '">' + esc(monthName(ym)) + '</a>',
    '<a href="#day-' + prev + '" data-go="day-' + prev + '" aria-label="Previous day">‹</a>' + (d !== t ? '<a href="#day-' + t + '" data-go="day-' + t + '" aria-label="Today" style="width:auto;padding:0 8px;font-size:13px">Today</a>' : '') + '<a href="#day-' + next + '" data-go="day-' + next + '" aria-label="Next day">›</a>');
  h += '<div class="head"><div class="bignum">' + dt.getUTCDate() + '</div><div class="headtext"><div class="wd">' + WD[dt.getUTCDay()] + (d === t ? ' <span class="pill">Today</span>' : '') + '</div><div class="sub">' + esc(monthName(ym)) + '</div></div></div>';
  if (evs.length) h += '<div class="section"><p class="label">Events</p><ul class="list">' + evs.map(e => rowEntry(e)).join('') + '</ul></div>';
  h += '<div class="section"><p class="label">Log</p>';
  if (items.length || ghosts.length) h += '<ul class="list">' + items.map(e => rowEntry(e)).join('') + ghosts.map(rowGhost).join('') + '</ul>';
  else h += emptyText('Nothing on this page yet.');
  h += '<button type="button" class="addrow" data-act="add-here">+ Add to ' + (d === t ? 'today' : esc(shortDay(d))) + '</button></div>';
  if (earlier.length) {
    h += '<div class="section"><p class="label">Still open from earlier days</p><ul class="list">' +
      earlier.map(e => rowEntry(e, {extra: '<button type="button" class="mini" data-act="move-here" data-id="' + esc(e.id) + '">Move here</button>'})).join('') + '</ul></div>';
  }
  return h;
}

function pageMonth(ym) {
  const t = todayStr(), n = daysInMonth(ym);
  const prev = addMonths(ym, -1), next = addMonths(ym, 1);
  let h = topbar(backIndex, '<a href="#month-' + prev + '" data-go="month-' + prev + '" aria-label="Previous month">‹</a><a href="#month-' + next + '" data-go="month-' + next + '" aria-label="Next month">›</a>');
  h += '<h1 class="title-xl">' + MONTHS[Number(ym.slice(5)) - 1] + '</h1><p class="kicker">' + ym.slice(0, 4) + ' · monthly log</p>';
  h += '<div class="section"><p class="label">Calendar</p>';
  for (let i = 1; i <= n; i++) {
    const d = ym + '-' + pad(i), w = dow(d), evs = eventsOn(d);
    const open = dayItems(d).filter(e => e.kind === 'task' && status(e) === 'open').length;
    const bits = evs.map(e => '<span class="ev">' + esc(e.title) + '</span>' + (e.allDay ? '' : ' <small>' + esc(e.startTime || '') + '</small>')).join(' · ');
    h += '<a class="mrow' + (w === 0 || w === 6 ? ' we' : '') + (d === t ? ' today' : '') + '" href="#day-' + d + '" data-go="day-' + d + '"><span class="mday"><b>' + i + '</b> ' + WD1[w] + '</span><span class="mev">' + bits + (open ? (bits ? ' ' : '') + '<small>' + open + ' task' + (open > 1 ? 's' : '') + '</small>' : '') + '</span></a>';
  }
  h += '</div>';
  const monthOnly = liveE().filter(e => e.kind === 'task' && !e.date && e.month === ym).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
  const dated = liveE().filter(e => e.kind === 'task' && e.date && e.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date));
  h += '<div class="section"><p class="label">Tasks this month</p>';
  if (monthOnly.length || dated.length) h += '<ul class="list">' + monthOnly.map(e => rowEntry(e, {meta: 'Any day'})).join('') + dated.map(e => rowEntry(e, {meta: shortDay(e.date)})).join('') + '</ul>';
  else h += emptyText('No tasks for ' + MONTHS[Number(ym.slice(5)) - 1] + ' yet.');
  h += '<button type="button" class="addrow" data-act="add-here">+ Add a task for ' + esc(monthName(ym)) + '</button></div>';
  return h;
}

function eventsUpcoming(days) {
  const t = todayStr(), seen = new Set(), out = [];
  for (let k = 0; k <= days; k++) {
    const d = addDays(t, k);
    eventsOn(d).forEach(e => { if (!seen.has(e.id)) { seen.add(e.id); out.push({e, d}); } });
  }
  return out;
}
function pageCalendar() {
  const t = todayStr(), ym = S.calYM, n = daysInMonth(ym);

  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(w => '<div class="wh" aria-hidden="true">' + w + '</div>').join('');
  for (let i = 0; i < offset; i++) cells += '<div class="cell blank"></div>';
  for (let i = 1; i <= n; i++) {
    const d = ym + '-' + pad(i), c = eventsOn(d).length;
    cells += '<button type="button" class="cell' + (d === t ? ' today' : '') + (d === S.calSel ? ' sel' : '') + '" data-act="cal-sel" data-d="' + d + '" aria-label="' + esc(shortDay(d)) + (c ? ', ' + c + ' event' + (c > 1 ? 's' : '') : '') + '" aria-pressed="' + (d === S.calSel) + '">' + i +
      (c ? '<span class="dots">' + '<i></i>'.repeat(Math.min(c, 3)) + '</span>' : '') + '</button>';
  }

  h += '<div class="cal">' + cells + '</div>';

function pageFuture() {

function pageCollections() {

function sortKey(e) { return e.date || e.startDate || (e.month ? e.month + '-00' : '') || (e.createdAt || '').slice(0, 10); }
function pageCollection(slug) {

function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function prose(body) {
  const lines = (body || '').split('\n'); let out = '', list = null;
  const close = () => { if (list) { out += '</ul>'; list = null; } };
  lines.forEach((ln, i) => {
    let m;
    if ((m = ln.match(/^\s*[-*]\s\[( |x|X)\]\s?(.*)$/))) {
      if (list !== 'c') { close(); out += '<ul class="checks">'; list = 'c'; }
      const on = m[1] !== ' ';
      out += '<li><label class="check"><input type="checkbox" data-act="chk" data-line="' + i + '"' + (on ? ' checked' : '') + '><span' + (on ? ' class="ticked"' : '') + '>' + inline(m[2]) + '</span></label></li>';
      return;
    }
    if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) { if (list !== 'u') { close(); out += '<ul>'; list = 'u'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    close();
    if ((m = ln.match(/^##\s+(.*)$/))) { out += '<h4>' + inline(m[1]) + '</h4>'; return; }
    if ((m = ln.match(/^#\s+(.*)$/))) { out += '<h3>' + inline(m[1]) + '</h3>'; return; }
    if (ln.trim()) out += '<p>' + inline(ln) + '</p>';
  });
  close();
  return out || '<p class="muted">This note is empty. Tap Edit to write it.</p>';
}

}

function searchResults(q) {

/* ---------- routing & render ---------- */
function parseRoute(h) {
  h = (h || '').replace(/^#/, '');
  let m;
  if (!h || h === 'index') return {name: 'index'};
  if (h === 'today') return {name: 'day', date: todayStr()};
  if ((m = h.match(/^day-(\d{4}-\d{2}-\d{2})$/))) return {name: 'day', date: m[1]};
  if ((m = h.match(/^month-(\d{4}-\d{2})$/))) return {name: 'month', ym: m[1]};
  if ((m = h.match(/^c-([a-z0-9-]+)$/))) return {name: 'collection', slug: m[1]};
  if ((m = h.match(/^n-([A-Za-z0-9_.~-]+)$/))) return {name: 'note', id: m[1]};
  if (['calendar', 'future', 'collections', 'search', 'deleted'].includes(h)) return {name: h};
  return {name: 'index'};
}
function go(tok) {
  if (S.sheet || !$('#sheet-root').hidden) closeSheet();
  S.route = parseRoute(tok); S.noteEdit = false; S.confirm = null; S.shown = null;
  try { history.pushState(null, '', '#' + tok); } catch (e) {}
  render();
  try { window.scrollTo(0, 0); } catch (e) {}
  if (S.route.name === 'search') setTimeout(() => { const q = $('#q'); if (q) try { q.focus(); } catch (e) {} }, 60);
}
window.addEventListener('popstate', () => { S.route = parseRoute(location.hash); S.noteEdit = false; S.confirm = null; S.shown = null; render(); });

function render() {
  const r = S.route, app = $('#app');
  $('#fab').disabled = S.mode === 'connecting';
  $('#fab').hidden = S.mode === 'signin';
  if (S.mode === 'signin') { if (S.shown !== 'signin') { app.innerHTML = pageSignin(); S.shown = 'signin'; } return; }
  if (r.name === 'note' && S.noteEdit && $('#note-body')) return;
  if (r.name === 'search' && S.shown === 'search' && $('#q')) { $('#results').innerHTML = searchResults($('#q').value); return; }
  let html;
  switch (r.name) {
    case 'day': html = pageDay(r.date); break;
    case 'month': html = pageMonth(r.ym); break;
    case 'calendar': html = pageCalendar(); break;
    case 'future': html = pageFuture(); break;
    case 'collections': html = pageCollections(); break;
    case 'collection': html = pageCollection(r.slug); break;
    case 'note': html = pageNote(r.id); break;
    case 'search': html = pageSearch(); break;
    case 'deleted': html = pageDeleted(); break;
    default: html = pageIndex();
  }
  app.innerHTML = banner() + html;
  S.shown = r.name;
}

function captureDefaults() {
  const r = S.route, t = todayStr();
  switch (r.name) {
    case 'day': return {date: r.date};
    case 'month': return {when: 'month', month: r.ym};
    case 'calendar': return {kind: 'event', startDate: S.calSel};
    case 'future': return {when: 'month', month: addMonths(t.slice(0, 7), 1)};
    case 'collection': return {col: r.slug};
    default: return {date: t};
  }
}

function exportCopy() {
  const text = JSON.stringify({exported: nowISO(), timezone: TZ, entries: all(), collections: [...S.cols.values()]}, null, 2);
  try {
    const url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = 'journal-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { toast("Couldn't save a copy here."); }
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go); return; }
  const a = ev.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  const e = id ? S.entries.get(id) : (S.sheet && S.sheet.id ? S.entries.get(S.sheet.id) : null);
  switch (act) {
    case 'close': closeSheet(); break;
    case 'toggle': if (e) toggleTask(e); break;
    case 'open': if (!e) break; if (e.kind === 'task') openTaskSheet(e); else if (e.kind === 'event') openEventSheet(e); else go('n-' + e.id); break;
    case 'k': {
      S.sheet.kind = a.dataset.k;
      a.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === a));
      $('#c-tn').hidden = S.sheet.kind === 'event'; $('#c-ev').hidden = S.sheet.kind !== 'event';
      $('#c-body-f').hidden = S.sheet.kind !== 'note';
      break;
    }
    case 'w': {
      S.sheet.when = a.dataset.w;
      a.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === a));
      $('#c-w-day').hidden = S.sheet.when !== 'day'; $('#c-w-month').hidden = S.sheet.when !== 'month';
      break;
    }
    case 'c-add': submitCapture(); break;
    case 'pick': { const s = a.dataset.slug; if (S.sheet.cols.has(s)) S.sheet.cols.delete(s); else S.sheet.cols.add(s); a.setAttribute('aria-pressed', S.sheet.cols.has(s)); break; }
    case 'newcol': addNewCol(); break;
    case 's-done': if (e) { closeSheet(); toggleTask(e); } break;
    case 's-cancel': if (e) { closeSheet(); const n = clone(e); n.status = status(e) === 'cancelled' ? 'open' : 'cancelled'; commit(e, n, n.status === 'cancelled' ? 'Task cancelled' : 'Task restored'); } break;
    case 'm-date': if (e) { const d = $('#m-date').value; if (!isDate(d)) break; closeSheet(); moveEntry(e, {date: d}); } break;
    case 'm-month': if (e) { closeSheet(); moveEntry(e, {month: $('#m-month').value}); } break;
    case 'm-later': if (e) { closeSheet(); moveEntry(e, {}); } break;
    case 's-save': if (e) {
      const title = $('#s-title').value.trim(); if (!title) { showErr('A task needs a name.'); break; }
      const n = clone(e); n.title = title; n.collections = [...S.sheet.cols]; closeSheet(); commit(e, n, 'Saved');
    } break;
    case 'ev-save': if (e) {
      const title = $('#s-title').value.trim(); if (!title) { showErr('An event needs a name.'); break; }
      const r = readEvent(); if (r.error) { showErr(r.error); break; }
      const n = Object.assign(clone(e), r.data, {title, collections: [...S.sheet.cols]}); closeSheet(); commit(e, n, 'Event saved');
    } break;
    case 's-delete': if (e) { closeSheet(); softDelete(e); } break;
    case 'move-here': if (e) moveEntry(e, {date: todayStr()}); break;
    case 'add-here': openCapture(captureDefaults()); break;
    case 'cal-prev': S.calYM = addMonths(S.calYM, -1); render(); break;
    case 'cal-next': S.calYM = addMonths(S.calYM, 1); render(); break;
    case 'cal-today': S.calYM = todayStr().slice(0, 7); S.calSel = todayStr(); render(); break;
    case 'cal-sel': S.calSel = a.dataset.d; render(); break;
    case 'cal-add': openCapture({kind: 'event', startDate: S.calSel}); break;
    case 'note-edit': S.noteEdit = true; render(); setTimeout(() => { const b = $('#note-body'); if (b) try { b.focus(); } catch (x) {} }, 60); break;
    case 'note-cancel': S.noteEdit = false; render(); break;
    case 'note-save': if (e) {
      const n = clone(e); n.title = $('#note-title').value.trim() || 'Untitled'; n.body = $('#note-body').value;
      S.noteEdit = false; commit(e, n, 'Note saved'); render();
    } break;
    case 'note-cols': if (e) openNoteMetaSheet(e, 'cols'); break;
    case 'note-move': if (e) openNoteMetaSheet(e, 'move'); break;
    case 'nc-save': if (e) { const n = clone(e); n.collections = [...S.sheet.cols]; closeSheet(); commit(e, n, 'Collections saved'); } break;
    case 'note-delete': if (e) { const back = e.date ? 'day-' + e.date : 'future'; softDelete(e); go(back); } break;
    case 'chk': if (e || S.route.name === 'note') {
      const en = S.entries.get(S.route.id); if (!en) break;
      const lines = (en.body || '').split('\n'), i = Number(a.dataset.line);
      if (lines[i] == null) break;
      lines[i] = lines[i].replace(/\[( |x|X)\]/, m => m === '[ ]' ? '[x]' : '[ ]');
      const n = clone(en); n.body = lines.join('\n'); writeEntry(n);
    } break;
    case 'restore': if (e) { const n = clone(e); n.deleted = false; n.deletedAt = null; commit(e, n, 'Restored to ' + whereLabel(n)); } break;
    case 'purge': if (e) { if (S.confirm !== 'purge:' + e.id) { S.confirm = 'purge:' + e.id; render(); break; } S.confirm = null; purgeEntry(e.id); toast('Deleted for good'); } break;
    case 'purge-all': { if (S.confirm !== 'purge-all') { S.confirm = 'purge-all'; render(); break; } S.confirm = null; all().filter(x => x.deleted).forEach(x => purgeEntry(x.id)); toast('Recently deleted is empty'); break; }
    case 'export': exportCopy(); break;
    case 'auth-toggle': S.signup = !S.signup; S.notice = null; S.shown = null; render(); break;
    case 'signout': if (sb) sb.auth.signOut(); break;
    case 'add-col': openNewCollection(); break;
    case 'nc-create': {
      const name = $('#nc-name').value.trim().replace(/\s+/g, ' '); if (!name) { showErr('Give the collection a name.'); break; }
      const ex = sortedCols().find(c => c.name.toLowerCase() === name.toLowerCase());
      if (ex) { closeSheet(); go('c-' + ex.slug); break; }
      let slug = slugify(name); if (S.cols.has(slug)) slug += '-' + Date.now().toString(36).slice(-3);
      writeCol({slug, name, createdAt: nowISO()}); closeSheet(); go('c-' + slug); break;
    }
    case 'col-remove': { const s = a.dataset.slug; if (S.confirm !== 'col:' + s) { S.confirm = 'col:' + s; render(); break; } S.confirm = null; purgeCol(s); go('collections'); toast('Collection removed'); break; }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'ev-allday') document.querySelectorAll('.ev-time').forEach(el => { el.hidden = ev.target.checked; });
  if (ev.target.id === 'ev-sd') { const ed = $('#ev-ed'); if (ed && (!ed.value || ed.value < ev.target.value)) ed.value = ev.target.value; }
});
document.addEventListener('input', ev => { if (ev.target.id === 'q') $('#results').innerHTML = searchResults(ev.target.value); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
  if (ev.key === 'Enter' && !ev.shiftKey) {
    if (ev.target.id === 'c-title') { ev.preventDefault(); submitCapture(); }
    else if (ev.target.id === 'newcol') { ev.preventDefault(); addNewCol(); }
    else if (ev.target.id === 'nc-name') { ev.preventDefault(); const b = document.querySelector('[data-act="nc-create"]'); if (b) b.click(); }
  }
});
$('#fab').addEventListener('click', () => { if (S.mode !== 'connecting') openCapture(captureDefaults()); });
setInterval(() => { const t = todayStr(); if (t !== S.today) { S.today = t; render(); } }, 60000);

/* ---------- boot ---------- */
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'auth') return;
  ev.preventDefault();
  const email = $('#a-email').value.trim(), pw = $('#a-pass').value, err = $('#a-err');
  const show = m => { err.textContent = m; err.hidden = false; };
  if (!email || pw.length < 8) { show('Enter your email and a password of at least 8 characters.'); return; }
  const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
  try {
    if (S.signup) {
      const {data, error} = await sb.auth.signUp({email, password: pw, options: {emailRedirectTo: location.origin + location.pathname}});
      if (error) throw error;
      if (data.session) { S.mode = 'connecting'; S.shown = null; render(); load(); return; }
      S.signup = false; S.notice = 'Check your email and tap the confirmation link. Then come back here and sign in.'; S.shown = null; render();
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password: pw});
      if (error) throw error;
      S.mode = 'connecting'; S.notice = null; S.shown = null; render(); load();
    }
  } catch (e) { show((e && e.message) || 'That didn\'t work. Check your email and password.'); btn.disabled = false; }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.mode === 'live' && !S.sheet && !S.noteEdit) load();
});

S.route = parseRoute(location.hash);
render();
(async () => {
  if (!window.supabase || !window.supabase.createClient) { S.mode = 'error'; render(); return; }
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'SIGNED_OUT') { S.mode = 'signin'; S.entries = new Map(); S.cols = new Map(); S.shown = null; closeSheet(); render(); }
  });
  try {
    const {data} = await sb.auth.getSession();
    if (data && data.session) load(); else { S.mode = 'signin'; S.shown = null; render(); }
  } catch (e) { S.mode = 'signin'; S.shown = null; render(); }
})();
})();
</script>
</body>
</html>
